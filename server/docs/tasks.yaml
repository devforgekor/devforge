kanban_labels:
  blocked: Blocked
  done: Done
  in_progress: In Progress
  todo: To Do
meta:
  add_checklist:
  - Append new task to todo with date and optional tags.
  done_checklist:
  - Move in_progress -> done (insert at top of done list).
  - 'If todo is non-empty: promote todo[0] -> in_progress.'
  - If a task becomes blocked, move it to blocked and record the blocker.
  - 'Log to DB: python3 /opt/projects/server/scripts/cli.py worklog add ''<title>''
    ''<summary>'' --agent ''<agent>'' --model ''<model>'' --tags ''<tags>'''
  - 'If decisions were made or issues found: update handover.yaml.'
  language: English only (machine-readable).
  location: /opt/projects/server/docs/tasks.yaml
  must_rules:
  - 'in_progress: exactly 1 task or null. Never leave a completed task in in_progress.'
  - 'todo: ordered by priority. Add new tasks to the end.'
  - 'blocked: keep blocked items separate from todo.'
  - 'done: keep at most 10 recent items. Older items exist only in worklog DB.'
  purpose: Shared Kanban task tracker for all AI agents on DevForge server.
  related_files:
  - /opt/projects/server/CLAUDE.yaml
  - /opt/projects/server/handover.yaml
  - /opt/projects/server/blueprint.yaml
  - /opt/projects/server/docs/design.md
  - /opt/projects/server/docs/phases.md
  - /opt/projects/server/_archive/README.md
