    items: []

target:
  services:
    - name: "llama-server"
      type: "systemd user"
      image: "localhost/devforge-llama:2026.05.13"
      model: "qwen2.5-coder-7b-instruct-q8_0.gguf"
      flags:
        threads: 4
        ctx_size: 16384
        mlock: false
        memory: "16g"
        cache_reuse: 256
        host: "0.0.0.0"
        port: 8080
      networking: "Quadlet pod network (devforge-net)"

    - name: "litellm"
      type: "systemd user / Quadlet container"
      purpose: "API gateway — unified OpenAI-compatible endpoint with model routing"
      endpoint: "127.0.0.1:4000"

    - name: "postgresql"
      type: "systemd user / Quadlet container"
      data_dir: "/dev/datavg/lv_db"
      mount: "/mnt/lv_db"
      purpose: "Application databases for seedling, litellm metadata"

    - name: "netdata"
      type: "systemd system"
      endpoint: "127.0.0.1:19999"
      purpose: "Real-time system monitoring dashboard with auto-discovery"

  network:
    internal_api: "ai-pod:8080 via devforge-net (published on host 8080)"
    gateway_api: "ai-pod:4000 via devforge-net (published on host 4000)"
    monitoring: "127.0.0.1:19999 (Netdata)"
    application: "TBD (FastAPI on UNIX socket or localhost port)"

  storage:
    lv_db:
      device: "/dev/datavg/lv_db"
      size: "30G"
      status: "mounted"
      target: "/mnt/lv_db (PostgreSQL 16 data directory)"

backlog:
