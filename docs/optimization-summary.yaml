# DevForge LLM Optimization Report (2026-06-06)

## Environment
- **Host**: ARM Neoverse-N1, 4-core, 22Gi RAM
- **Model**: Qwen2.5-Coder-7B-Instruct Q8_0 (7.6GB)
- **Runtime**: llama.cpp v9519 (KleidiAI enabled)
- **Container**: ghcr.io/ggml-org/llama.cpp:server (prebuilt)

## Results Summary

### Phase 0 — Baseline
| Test | Decode t/s | Prefill t/s | Note |
|------|-----------|-------------|------|
| short prompt, 50tok | 3.29 | 16.3 | Baseline A |
| medium prompt, 100tok | 3.27 | 19.0 | Baseline B (primary) |

### Phase 1 — Runtime Parameters (no improvement)
| Parameter | Decode t/s | vs Baseline | Verdict |
|-----------|-----------|-------------|---------|
| Baseline (mlock=0, f32 KV) | 3.27 | — | Reference |
| MLOCK=1 | 3.12 | -4.6% | Skip |
| CACHE_TYPE_K/V=q8_0 | 2.97 | -9.2% | Skip |
| FLASH_ATTN=1 | 3.13 | -4.3% | Skip |
| UBATCH_SIZE=256 | 3.12 | -4.6% | Skip |
| Threads=3 | — | — | Not tested (bandwidth bound) |

**Conclusion**: Decode stage is purely memory-bandwidth-bound. No runtime parameter changes the amount of data moved per token.

### Phase 2 — Model Quantization
| Quant | Model Size | Decode t/s | vs Baseline | Note |
|-------|-----------|-----------|-------------|------|
| Q8_0 | 7.6 GB | 3.27 | Reference | Current |
| Q4_K_M | 4.4 GB | 2.75 | -15.9% | Slower on ARM without SVE |

**Conclusion**: Q4_K_M dequantization overhead > bandwidth savings on Neoverse-N1 (no SVE). Q8_0 is optimal for this CPU.

### Phase 3 — System-Level Tuning
| Tuning | Before | After | Impact |
|--------|--------|-------|--------|
| THP | always | madvise | Reduced page fault latency |
| NUMA balancing | off (0) | off (0) | Already optimal |
| vm.swappiness | 10 | 10 (maintain) | Low enough |
| I/O scheduler | none | none (NVMe) | Correct for managed storage |

### Phase 4 — Custom Container Build
| Build | Decode t/s | vs Baseline | Note |
|-------|-----------|-------------|------|
| Prebuilt (KleidiAI) | 3.27 | Reference | — |
| Custom (-mcpu=neoverse-n1, no KleidiAI) | 2.17 | -33.6% | Missing KleidiAI kernels |

**Conclusion**: Prebuilt ghcr.io image already has ARM-optimized KleidiAI backends. Custom build without submodules is worse. To match prebuilt quality, full submodule checkout + KleidiAI build is required but no expected gain over prebuilt.

### Phase 5 — Pod A
Pod A (3B Q8_0 refuter) already has optimal settings:
- flash-attn=on, cache-type-k/v=q8_0, batch=2048, ubatch=512
- threads=2 (appropriate for 3B model)

## Critical Discovery

### Dual-Pod Performance Contention
Running **Pod A and Pod B simultaneously** causes 55% decode degradation (3.27 → 1.39 t/s).

| Configuration | Decode t/s | Degradation |
|--------------|-----------|-------------|
| Pod B only (7B) | 3.27 | Reference |
| Pod B + Pod A (7B + 3B) | 1.39 | -57.4% |

**Root cause**: Both llama-server instances load full model weights (~7.6GB + ~3.1GB = ~10.7GB) + KV cache + overhead. On 22GB RAM with ~13GB available, memory bandwidth contention between two concurrent model feeds exceeds the DDR4 bus capacity of 4 ARM cores.

**Recommendation**: Schedule Pod A and Pod B sequentially, not concurrently. The pipeline should alternate between refuter (3B) and MCP (7B) calls.

## Final Server Configuration (Optimal)
```
# container-devforge-swap.container
Image=ghcr.io/ggml-org/llama.cpp:server   # prebuilt with KleidiAI
MLOCK=0                                    # no benefit, reduces avail RAM
CACHE_TYPE_K= (default f32)                # no benefit for 7B Q8_0
CACHE_TYPE_V= (default f32)
FLASH_ATTN= (off)                          # CPU no benefit
UBATCH_SIZE= (default 512)
BATCH_SIZE=1024                            # current
SERVER1_THREADS=4                          # optimal for 4-core
```
