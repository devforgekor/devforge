# =============================================================================
# 8. OPEN QUESTIONS (post-v1.1)
# =============================================================================
open_questions:
  - id: "OQ1"
    question: "Should the orchestrator support session pause/resume mid-debate?"
    context: >
      A full 5-round session takes 14-22 minutes. If the user needs to
      interrupt (e.g., for a different task), JSONL state already supports
      resume. A --pause flag could save state and exit cleanly.
    recommendation: "Defer to Phase 4. Not required for MVP."

  - id: "OQ2"
    question: "Should we add a 'quick mode' with only 3 rounds for simple questions?"
    context: >
      Some questions may converge in 2 rounds. A --quick flag could reduce
      max rounds to 3 + final synthesis.
    recommendation: "Defer. Early exit already handles fast convergence."

  - id: "OQ3"
    question: "How to handle non-code debate topics (architecture decisions, tool selection)?"
    context: >
      The current prompt templates are code-centric. Non-code topics
      may need different output schemas (no code_snippet field).
    recommendation: "Add topic_type parameter to DebateSession. Default='code'. Add 'architecture' variant in Phase 4."

