overview:
  hostname: devforge
  purpose: OCI ARM development server — LLM inference + FastAPI application hosting
  os: Oracle Linux Server 9.7 (aarch64)
  cpu: ARM Neoverse-N1, 4-core
  memory: 22Gi + 4G zram (2.4G) + 8G swap (swappiness=10)
storage:
  boot_disk:
    device: /dev/sda (50GB)
    vg: ocivolume
    lvs:
    - lv: lv_logs
      size: 10G
      mount: /var/log
    - lv: lv_meta
      size: 4.5G
      mount: /mnt/secure_meta
    - lv: lv_tmp
      size: 10G
      mount: /var/tmp
    - lv: root
      size: 20G
      mount: /
    free: 0G
  data_disk:
    device: /dev/sdb (150GB)
    vg: datavg
    lvs:
    - lv: lv_ai_data
      size: 100G
      mount: /opt/ai_data
    - lv: lv_db
      size: 30G
      mount: /mnt/lv_db
    - lv: lv_projects
      size: 10G
      mount: /opt/projects
    - lv: lv_swap
      size: 4G
      mount: SWAP
    - lv: lv_workspace
      size: 6G
      mount: /opt/workspace
    free: 0G
containers:
  runtime: Podman (rootless, user opc)
  image: ghcr.io/ggml-org/llama.cpp:server
  model: phi-4-Q4_K_M.gguf
  flags: (dynamic entrypoint — query /v1/models for live config)
  target_flags: --threads 4 --threads-batch 4 --ctx-size 16384 --flash-attn on --cache-reuse 256 --host 0.0.0.0
services:
- name: devforge-api
  status: active
- name: devforge-qwen
  status: active
- name: devforge-swap
  status: active
- name: postgres
  status: active
  type: systemd user
- name: devforge-backup
  status: inactive
- name: devforge-restore-test
  status: inactive
- name: caddy
  status: active
  type: systemd system (rootful podman)
- name: netdata
  status: active
  type: systemd system (native)
network:
  interface: enp0s6
  ip: 10.0.0.75/24
  firewall: firewalld — SSH + dhcpv6-client
  exposed_ports:
  - 22/tcp (SSH, key-only)
  - 111/tcp (rpcbind)
  llm_api: localhost:8081
  netdata: 127.0.0.1:19999
projects:
  root: /opt/projects
  active: []
  shared:
  - name: common-lib
    path: /opt/projects/common-lib/
    what: LEGO-block modular Python library, 32 modules
  dormant:
  - path: /opt/projects/common-lib/harvest/
    what: 9 harvested projects awaiting module extraction
  venv:
  - name: aider-env
    path: /opt/projects/aider-env/
    what: Python 3.11 venv for AI coding assistants
entry_points:
  overview: CLAUDE.yaml (this file)
  blueprint: blueprint.yaml (target architecture, phases, backlog — read on any planning/architectural work)
  structural_status: state.yaml#structural
  metrics_snapshot: state.yaml#metrics
  change_log: changelog.yaml (< 3 months, always read)
  change_archive: changelog_archive.yaml (> 3 months, read on demand)
  session_handover: handover.yaml (last checkpoint + AI decisions/known_issues, always read on session start)
  task_tracker: 'tasks.yaml (todo/in_progress/blocked/done — all AI agents share this file; labels: To Do/In Progress/Blocked/Done)'
  timer_registry: docs/timer-registry.yaml (all systemd timers, schedules, and script mappings)
  references: docs/references.md (external tools, frameworks, research — LLM/AI)
  infra_references: _archive/reference-watchlist.md + reference-tracking-policy.yaml (infrastructure version tracking, 4-month
    cycle)
  retention: indefinite — no deletion, archive-only after 3 months
refresh:
  trigger: server-state-collector.timer (systemd user, 15min interval)
  script: /opt/projects/server/scripts/state_collector/main.py
  flow: collect -> state.yaml -> hash detect -> changelog (if changed) -> archive -> CLAUDE.yaml -> MOTD
  legacy_removed: gen_motd.py, gen_motd_system.py, gen_tasks.py, gen_motd_task_unified.py, gen_motd_task.py (2026-05-23)
  dead_code_cleanup_2026-05-23: slack_notify.py, monitor_health.py, test_review_models.py, install_dark_theme.sh, run_model_sequence.sh,
    debug_run_t01_t08.sh, devforge-qwen-worker.{service,timer}, /opt/projects/systemd/user/ (stale snapshot)
  auto: true
handover:
  trigger: handover-gen.timer (systemd user, 10min interval) + SessionEnd hook
  script: /opt/projects/server/scripts/update_handover.py
  flow: scan recent files -> git status -> preserve AI sections -> write handover.yaml
  auto: true
  ai_writes:
  - obs_dec
  - mcp_dec
  - known_issues
tracked:
  structural:
  - 'storage: LVM layout, mount status — change triggers changelog'
  - 'containers: name, status, ports, model — change triggers changelog'
  - 'services: systemd user unit active/inactive/not-installed — change triggers changelog'
  - 'network: IP address, TCP listen ports — change triggers changelog'
  metrics:
  - 'system: CPU load, memory %, zram — snapshot only'
  - 'storage_use: disk usage % per mount — snapshot only'
  - 'containers_uptime: uptime strings — snapshot only'
  - 'alerts: threshold-based warnings/criticals — derived, snapshot only'
not_tracked:
- installed packages (rpm, pip) — use 'dnf list installed' or 'pip list'
- firewall rules — use 'sudo firewall-cmd --list-all'
- user config files (.bashrc, .tmux.conf, etc.) — read directly
- kernel parameters, sysctl, SELinux — use appropriate system tools
- OCI cloud configuration (VNIC, security lists) — use OCI CLI/console
- Claude Code API keys — stored in ~/.bashrc.d/claude-env (ANTHROPIC_BASE_URL, ANTHROPIC_AUTH_TOKEN, ANTHROPIC_MODEL)
rules:
  must:
  - CLAUDE.yaml is the single entry point — read this first.
  - ? Read handover.yaml on session start for decisions and known_issues. Read tasks.yaml for todo/in_progress tasks. Before
      session end
    : update tasks.yaml (move done, promote todo), update handover.yaml decisions/known_issues, log completed work with cli.py
      worklog add.
  - Update blueprint.yaml and phases.md when phases progress or architecture decisions change.
  - All machine-readable content MUST be English.
  - state.yaml is auto-generated. NEVER edit manually.
  - changelog.yaml is append-only. NEVER modify existing entries.
  - Use state_collector/main.py for all state/changelog/MOTD updates.
  - Structural changes trigger changelog entry. Metrics changes do NOT.
  - 'Timezone: system internals (logs, timestamps, systemd timers) MUST use UTC. User-facing output (MOTD, CLI, reports) MUST
    convert to KST (UTC+9).'
  - Container orchestration is Quadlet-only under ~/.config/containers/systemd/. Do not restore legacy generated unit files
    from ~/.config/systemd/user/_legacy-generate-systemd/.
  - Secrets are injected only via EnvironmentFile=~/.config/devforge/secrets.env (chmod 600). Never store credentials inline
    in Quadlet or app config.
  - 'tmux: source-file only adds hooks, never removes them. After deleting a hook from .tmux.conf, MUST run tmux set-hook
    -gu <hook-name> to purge from running server.'
  - 'Documentation cleanup: obsolete files MUST move to _archive/ first, never delete directly. Update _archive/README.md
    with: 보관 사유 (why), 삭제 조건 (when safe to delete), 대체 위치 (replacement), 주의 (warnings). Delete original only after archive
    copy and README entry confirmed.'
  - 'Single source of truth for DevForge: /opt/projects/server/docs/ (design.md, phases.md, tasks.yaml) + devforge_app.worklog_entries
    (DB). No DevForge documentation outside /opt/projects/server/.'
  - 'tasks.yaml is the single task tracker. All AI agents read it on session start. in_progress: max 1. todo: priority order.
    blocked: separate queue. done: max 10. Follow meta.done_checklist when completing a task.'
  - 'File naming: Python/Shell/JS → snake_case (link_turns.py, nightly_batch.sh). Config/Docs → lowercase (blueprint.yaml,
    design.md). Directories → single English word (app/, scripts/, docs/). CLI entry point → cli.py at repo root. Reserved:
    routes_ prefix for grouped router modules (routes_search.py) — only when a single router file grows beyond 700 lines.'
  should:
  - 'Prefer Python stdlib. Only dependency: pyyaml.'
  - 'changelog.archive policy: entries > 3 months move to changelog_archive.yaml.'
  - MOTD reflects real-time state; state.yaml reflects last collected snapshot.
  - Monitoring should treat transient podman healthcheck units/scopes as noise; alert on stable unit health (ai-pod.service,
    data-pod.service, container-*.service, devforge-*.timer/service).
