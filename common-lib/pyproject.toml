[project]
name = "common-lib"
version = "1.0.0"
description = "Shared Python utilities for seedling & related projects"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "oci>=2.100",
    "pytz",
]

[dependency-groups]
azure = [
    "azure-identity>=1.19",
    "azure-storage-blob>=12.23",
    "azure-data-tables>=12.6",
    "azure-servicebus>=7.12",
    "azure-cosmos>=4.0",
]
oci = [
    "oci>=2.100",
]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
