# ============================================================================
# DevForge Agent Architecture — Complete System Specification
# ============================================================================
# Purpose: Single-document reference for external LLM review.
# Covers: hardware, models, current scripts, proposed architecture,
#         data flow, deployment plan, design rationale.
# Author: DevForge / Claude Code
# Date: 2026-05-29
# ============================================================================

# ════════════════════════════════════════════════════════════════════════════
# SECTION 1: HARDWARE & INFRASTRUCTURE
# ════════════════════════════════════════════════════════════════════════════

hardware:
  host: OCI Ampere ARM (Oracle Linux 9.7)
  cpu:
    architecture: aarch64 (ARM Neoverse-N1)
    cores: 4
    bogomips_per_core: 50.00
  memory:
    total_ram_gb: 22
    zram_gb: 4
    zram_compression: zstd
    zram_effective_ratio: "5.15:1 for general data, ~1:1 for quantized model weights"
    disk_swap_gb: 4
    disk_swap_priority: 10 (low, zram preferred)
    typical_available_gb: 13  # with 30B running on :8080
  storage:
    - device: ocivolume-root
      size_gb: 20
      mount: /
      used_gb: 15
    - device: datavg-lv_ai_data
      size_gb: 100
      mount: /opt/ai_data
      used_gb: 72
      contents: "model GGUF files (72GB), debate sessions, worklog"
    - device: datavg-lv_db
      size_gb: 30
      mount: /mnt/lv_db
      used_gb: 0.4
      contents: PostgreSQL 16 data
    - device: datavg-lv_projects
      size_gb: 10
      mount: /opt/projects
      used_gb: 0.7
      contents: application code, scripts, docs
    - device: ocivolume-lv_tmp
      size_gb: 10
      mount: /var/tmp
      used_gb: 3.7
      contents: pipeline outputs, temp files

container_runtime:
  engine: Podman rootless (user opc)
  orchestration: Quadlet systemd units
  network: devforge-net (bridge, 10.89.0.0/24)
  containers:
    data-pod:
      type: pod
      containers:
        postgres:
          image: localhost/devforge-postgres:2026.05.15
          port: 5432
          db: devforge_app
          extensions: [pg_trgm, JSONB]
    devforge-qwen:
      unit: container-devforge-qwen.service
      role: "Pod A — primary model server"
      image: ghcr.io/ggml-org/llama.cpp:server
      ports: ["127.0.0.1:8080:8080"]
      model: Qwen3-Coder-30B-A3B-Instruct-Q3_K_M.gguf (14GB)
      ctx: 4096
      threads: 4
    devforge-swap:
      unit: container-devforge-swap.service
      role: "Pod B — swappable model server (mode-dependent)"
      image: ghcr.io/ggml-org/llama.cpp:server
      ports: ["127.0.0.1:8081-8082:8081-8082"]
      modes:
        debate:
          model: Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf (1.8GB)
          port: 8082
          ctx: 4096
          threads: 2
        review:
          model: Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf (8.4GB)
          port: 8081
          ctx: 4096
          threads: 4
        r1-8b:
          model: DeepSeek-R1-0528-Qwen3-8B-Q4_K_M.gguf (4.9GB)
          port: 8081
          ctx: 8192
          threads: 4
        qwen-7b:
          model: Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf (4.7GB)
          port: 8081
          ctx: 4096
          threads: 4
        selene:
          model: selene-1-mini-llama-3.1-8b-q4_k_m.gguf (4.6GB)
          port: 8081
          ctx: 4096
          threads: 4
        verify:
          model: Qwen2.5-Coder-32B-Instruct-IQ4_XS.gguf (17GB)
          port: 8081
          ctx: 16384
          threads: 4
    caddy:
      type: system service
      ports: [80, 443, 2019]
      role: reverse proxy + auto-HTTPS
  services:
    - devforge-api (standalone, :8000, MCP SSE)
    - devforge-turn-watcher (real-time session → PostgreSQL)
    - netdata (system monitoring, :19999)

# ════════════════════════════════════════════════════════════════════════════
# SECTION 2: MODEL CATALOG
