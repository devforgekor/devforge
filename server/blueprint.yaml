# DevForge Blueprint — Target Architecture & Roadmap v2.0
# AI-maintained: updated as phases progress, items complete, or architecture decisions change.
# Human reads for context; AI writes to keep current.
# Phase status: planned → active → complete
# Last updated: 2026-05-23 (auto — phase_tracker)

phases:
  - phase: 1
    name: "Basic Infrastructure + MCP Server"
    status: "complete"
    completed: "2026-05-14"
    items:
      - "Podman Quadlet containers (devforge-api, postgres)"
      - "PostgreSQL 16 + pg_trgm + JSONB meta"
      - "MCP SSE server (mem_save, mem_search)"
      - "POST /ingest (batch conversation storage)"
      - "Python CLI (search/save/recent/worklog add/recent/search)"
      - "GET /stats (7-section dashboard)"
      - "daily pg_dump + monthly restore test"
      - "worklog_entries DB table + tasks.yaml Kanban task tracker"
      - "auto_commit_guard.py auto-commit + session_context.py context injection"
      - "collect_turns.py 15min auto-collect (Claude Code + Copilot)"
      - "link_turns.py nightly turn↔worklog matching"
      - "activity_log table + commit/stage/review logging"

  - phase: "1.5"
    name: "LLM Inference Infrastructure"
    status: "complete"
    completed: "2026-05-23"
    items:
      - "2-Container architecture — Podman A (Qwen3-4B:8080) + Podman B (mode-switchable:8081-8082)"
      - "Mode switch system (normal / batch / code) via current-mode.env"
      - "code_mod_pipeline.py — 32B 4-stage pipeline (ANALYZE→PLAN→IMPL→PACKAGE)"
      - "Prompt ablation — code slicing 89% token reduction"
      - "review_worker.py — 3-LLM debate (Qwen3-4B + Llama-3B parallel → Phi-4-mini arbitration)"
      - "review_facts DB + performance metrics (6 columns)"
      - "RateEstimator dynamic timeout"
      - "Slack notification integration (stage completion DM)"
      - "Reference tracking — lib/refs.py (GitHub API 5 projects + git grep, 15min cycle)"
      - "DB references table + state_collector/main.py integration"

  - phase: 2
    name: "Enhancement"
    status: "planned"
    sub_phases:
      - name: "2.1 Recovery / Stabilization"
        items:
          - "swap-batch.timer + swap-normal.timer re-enable"
          - "review-worker.timer re-enable"
          - "LiteLLM: fix or remove (currently failed, unused)"
          - "devforge-llm: fix or remove (currently failed, replaced by swap)"
          - "journald log retention config (MaxRetentionSec=30day)"
      - name: "2.2 Semantic Search (pgvector)"
        items:
          - "pgvector extension + turns.text embedding vector column"
          - "embed_turns.py (local Qwen or API)"
          - "CLI search --semantic (pgvector ANN + ILIKE hybrid)"
          - "MCP mem_search vector upgrade"
      - name: "2.3 MemPalace Classification"
        items:
          - "wing/room category schema definition"
          - "Auto-classification (LLM-based, similar to review_worker pattern)"
          - "CLI search --wing/--room filtering"
          - "Classification results → activity_log"
      - name: "2.4 Search-Augmented Integration"
        items:
          - "DuckDuckGo search → LLM inference pipeline"
          - "cli.py search --augmented (search + LLM analysis)"
          - "Integration with existing /opt/projects/qwen-cli if available"
      - name: "2.5 Reference Tracking Upgrade"
        items:
          - "rss-monitor.service — GitHub RSS periodic polling (9 references)"
          - "Snyk/CISA vulnerability auto-scan (container images)"
          - "4-month refresh cycle automation (first run 2026-08-15)"
          - "refresh-log.md auto-recording"
      - name: "2.6 Web UI"
        items:
          - "Conversation search dashboard (FastAPI + simple frontend)"
          - "Model performance dashboard (review_facts stats visualization)"
          - "activity_log real-time feed"

  - phase: 3
    name: "Someday/Maybe"
    status: "planned"
    items:
      - "Chrome Extension → direct server upload (currently via Mac relay)"
      - "iOS Shortcuts integration"
      - "Multi-LLM routing (additional models)"

target:
  architecture: "2-Container (current, 2026-05-23)"
  containers:
    - name: "devforge-qwen"
      role: "Podman A — Qwen3-4B on :8080"
      model: "Qwen3-4B-Q4_K_M.gguf"
      memory_max: "6G"
      ctx_size: 4096
    - name: "devforge-swap"
      role: "Podman B — Mode-switchable on :8081-8082"
      modes:
        normal: "Phi-4-mini Q8_0 :8081 + Llama-3.2-3B Q8_0 :8082"
        batch: "Phi-4 Q4_K_M (14B) :8081"
        code: "Qwen2.5-Coder-32B IQ4_XS :8081 (Podman A must be stopped)"
      memory_max: "26G"
    - name: "devforge-api"
      role: "Application server :8000"
      type: "systemd user / Quadlet container"
    - name: "postgres"
      role: "PostgreSQL 16 :5432"
      type: "systemd user / Quadlet container"
  services:
    - name: "caddy"
      role: "Reverse proxy (host network, auto-HTTPS)"
    - name: "netdata"
      role: "System monitoring :19999"

