# =============================================================================
# 5. RESOLVED DESIGN DECISIONS
# =============================================================================
decisions:
  - id: "D1"
    question: "DeepCoder-14B vs 6.7B?"
    answer: "DeepCoder-14B-Preview Q4_K_M. 3/3 reviewers agree."
    rationale: "Refutation quality ≥ proposer quality is non-negotiable for debate efficacy."

  - id: "D2"
    question: "Make DRAG optional?"
    answer: "Yes. Add --skip-drag CLI flag + auto-detection heuristics."
    implementation: "Skip if: (a) file paths present, (b) error messages present, (c) --skip-drag flag set."

  - id: "D3"
    question: "5 rounds vs dynamic?"
    answer: "Fixed max=5 + early exit. No change from spec."

  - id: "D4"
    question: "Phi-4-14B MLOCK?"
    answer: "mlock=1. 3/3 reviewers agree."
    rationale: "Sequential execution = no RAM contention. 12GB RSS is safe."

  - id: "D5"
    question: "Persist shared_context?"
    answer: "No. Persist decision_summary + final_code to PostgreSQL instead."
    rationale: "Raw context grows unbounded. Summarized knowledge is more useful for future sessions."

  - id: "D6"
    question: "32B context overflow risk?"
    answer: "Add Phi-4-14B history summary step before Round 5."
    implementation: "Phi-4-14B receives full history → outputs 500-word summary → Qwen-32B receives summary + last 2 rounds only."

  - id: "D7"
    question: "DeepCoder max_tokens?"
    answer: "Start with 8192. Increase only if <think> truncation observed."

  - id: "D8"
    question: "JSON parsing strategy?"
    answer: "stdlib json.loads() with regex fallback. No external parser library."
    rationale: "Keep stdlib-only policy. Regex recovery handles 90% of malformed JSON cases."

# =============================================================================
# 6. RISK REGISTER
# =============================================================================
risks:
  - risk: "Model switch timeout during container restart"
    likelihood: "low"
    impact: "medium (round skipped, session continues)"
    mitigation: "180s timeout + 2 retries. If still fails, skip round and log."

  - risk: "DeepCoder JSON malformation due to <think> chain bleed"
    likelihood: "medium"
    impact: "low (regex recovery, re-prompt once)"
    mitigation: "Extract JSON from last complete object in response. Re-prompt with STRICT JSON ONLY if parse fails."

  - risk: "Search API rate limit during DART triggers"
    likelihood: "low"
    impact: "medium (missing context, debate continues)"
    mitigation: "Dedup filter. Max 3 searches/session. Fallback: continue without search."

  - risk: "22GB RAM ceiling with Qwen-32B + full context"
    likelihood: "low"
    impact: "high (OOM kill, session lost)"
    mitigation: "History summary step reduces context size for 32B. JSONL state enables resume."

# =============================================================================
