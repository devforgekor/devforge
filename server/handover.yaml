- 'OOM Recovery Procedure (2026-05-25): When OOM or swap thrashing occurs during model switch: (1) rm -f /opt/ai_data/debate/switch/model-switch.json
  — stop new model request. (2) kill -TERM <loading_llama_pid> — kill stuck loader, wait 3s, kill -9 if needed. (3) swapoff
  -a && swapon -a — reset swap to clear thrashing (optional, kernel reclaims over time). (4) systemctl --user restart container-devforge-swap
  — restart with fresh memory guard. (5) Verify free -h: ~8GB+ available before next attempt. Prevention: always restart container-devforge-swap
  after memory_guard.sh updates — old supervisor lacks eviction. Current issue: supervisor running pre-eviction code needs
  restart to activate posix_fadvise eviction.'
- 'Swap sizing note (2026-05-25): 8GB swap (4GB zram + 4GB disk) too small for dual MoE operation. GLM(~9GB RSS) + Qwen30B(~10GB
  RSS) = 19GB active + page cache > 24GB. Only works WITH page cache eviction (posix_fadvise DONTNEED on GLM before Pod B
  load). Without eviction, swap fills and system thrashes. Consider increasing zram to 8GB for more headroom.'
