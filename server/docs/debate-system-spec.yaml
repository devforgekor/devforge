# 16. CONSENSUS TREND VISUALIZATION (F8)
# =============================================================================
consensus_visualization:
  description: "ASCII bar chart printed after each round for user readability"
  format: |
    Round 0 (DRAG):   N/A (query consensus only)
    Round 1 (DART):   ████████░░  72%  [Alpha wins]
    Round 2 (DART):   █████████░  85%  [Alpha wins]
    Round 3 (DART):   ██████████  93%  [Tie — Early Exit triggered]
    Round 5 (Final):  ██████████  95%  [32B Synthesis complete]
  render_rule: "Each █ = 10%, ░ for partial 10%. Width = 10 chars for 0-100%."

# =============================================================================
# 17. RISK REGISTER (from consolidated review)
# =============================================================================
risks:
  - risk: "Model switch timeout during hot-swap"
    likelihood: "low"
    impact: "medium (round skipped, session continues)"
    mitigation: "240s timeout in orchestrator + 2 retries. If still fails, skip round and log."

  - risk: "DeepCoder JSON malformation due to <think> chain bleed"
    likelihood: "medium"
    impact: "low (regex recovery, re-prompt once)"
    mitigation: "Extract JSON from last complete object in response. Re-prompt with STRICT JSON ONLY if parse fails."

  - risk: "Search API rate limit during DART triggers"
    likelihood: "low"
    impact: "medium (missing context, debate continues)"
    mitigation: "Dedup filter (A3). Max 3 searches/session. Fallback: continue without search."

  - risk: "22GB RAM ceiling with Qwen-32B + full context"
    likelihood: "low"
    impact: "high (OOM kill, session lost)"
    mitigation: "History summary step (A2) reduces context size. JSONL state enables resume."

  - risk: "Page cache thrashing when alternating large models"
    likelihood: "high"
    impact: "low (slower loads, but system remains stable)"
    mitigation: "Accept 40-132s load times as baseline. Supervisor preserves container uptime across switches."
