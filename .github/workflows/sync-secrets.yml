name: Sync Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-secrets.yml'
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate secrets.env from GitHub Secrets
        env:
          BRAVE_API_KEYS_1: ${{ secrets.BRAVE_API_KEYS_1 }}
          BRAVE_API_KEYS_2: ${{ secrets.BRAVE_API_KEYS_2 }}
          BRAVE_API_KEYS_3: ${{ secrets.BRAVE_API_KEYS_3 }}
          BRAVE_API_KEYS_4: ${{ secrets.BRAVE_API_KEYS_4 }}
          CONTEXT7_API_KEY_1: ${{ secrets.CONTEXT7_API_KEY_1 }}
          CONTEXT7_API_KEY_2: ${{ secrets.CONTEXT7_API_KEY_2 }}
          CONTEXT7_API_KEY_3: ${{ secrets.CONTEXT7_API_KEY_3 }}
          CONTEXT7_API_KEY_4: ${{ secrets.CONTEXT7_API_KEY_4 }}
          DATAIMPULSE_PROXY_LIST: ${{ secrets.DATAIMPULSE_PROXY_LIST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DUCKDNS_ACCOUNT: ${{ secrets.DUCKDNS_ACCOUNT }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          EXA_API_KEYS_1: ${{ secrets.EXA_API_KEYS_1 }}
          EXA_API_KEYS_2: ${{ secrets.EXA_API_KEYS_2 }}
          EXA_API_KEYS_3: ${{ secrets.EXA_API_KEYS_3 }}
          EXA_API_KEYS_4: ${{ secrets.EXA_API_KEYS_4 }}
          GUDOKPIN_API_KEY: ${{ secrets.GUDOKPIN_API_KEY }}
          MASKPROXY_API_KEY: ${{ secrets.MASKPROXY_API_KEY }}
          MASKPROXY_PROXY_LIST: ${{ secrets.MASKPROXY_PROXY_LIST }}
          MINIPARK4U_SMTP_PASSWORD: ${{ secrets.MINIPARK4U_SMTP_PASSWORD }}
          MY_COPILOT_GITHUB_TOKEN_KEY: ${{ secrets.MY_COPILOT_GITHUB_TOKEN_KEY }}
          MY_GITHUB_TOKEN_KEY: ${{ secrets.MY_GITHUB_TOKEN_KEY }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          NOTION_TOKEN_KEY: ${{ secrets.NOTION_TOKEN_KEY }}
          OPENROUTER_HYEONMINPARK4U_API_KEY: ${{ secrets.OPENROUTER_HYEONMINPARK4U_API_KEY }}
          OPENROUTER_MESIDS_API_KEY: ${{ secrets.OPENROUTER_MESIDS_API_KEY }}
          OPENROUTER_MINIPARK4U_API_KEY: ${{ secrets.OPENROUTER_MINIPARK4U_API_KEY }}
          SLACK_BOT_TOKEN_KEY: ${{ secrets.SLACK_BOT_TOKEN_KEY }}
          SLACK_SIGNING_SECRET_KEY: ${{ secrets.SLACK_SIGNING_SECRET_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST_TOKEN_KEY: ${{ secrets.TELEGRAM_TEST_TOKEN_KEY }}
          TELEGRAM_TOKEN_KEY: ${{ secrets.TELEGRAM_TOKEN_KEY }}
          TRAVILY_API_KEYS_1: ${{ secrets.TRAVILY_API_KEYS_1 }}
          TRAVILY_API_KEYS_2: ${{ secrets.TRAVILY_API_KEYS_2 }}
          TRAVILY_API_KEYS_3: ${{ secrets.TRAVILY_API_KEYS_3 }}
          TRAVILY_API_KEYS_4: ${{ secrets.TRAVILY_API_KEYS_4 }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_REVALIDATE_TOKEN_KEY: ${{ secrets.VERCEL_REVALIDATE_TOKEN_KEY }}
          VERCEL_TOKEN_KEY: ${{ secrets.VERCEL_TOKEN_KEY }}
          YOUCOM_API_KEYS_1: ${{ secrets.YOUCOM_API_KEYS_1 }}
          YOUCOM_API_KEYS_2: ${{ secrets.YOUCOM_API_KEYS_2 }}
          YOUCOM_API_KEYS_3: ${{ secrets.YOUCOM_API_KEYS_3 }}
          YOUCOM_API_KEYS_4: ${{ secrets.YOUCOM_API_KEYS_4 }}
        run: |
          python3 scripts/deploy/sync-secrets.py > /tmp/github-secrets.env
          wc -l /tmp/github-secrets.env

      - name: Backup existing secrets.env
        uses: appleboy/ssh-action@v1.3.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cp ~/.config/devforge/secrets.env ~/.config/devforge/secrets.env.bak.$(date +%Y%m%d%H%M%S) 2>/dev/null || true

      - name: Upload secrets.env for merge
        uses: actions/upload-artifact@v4
        with:
          name: github-secrets
          path: /tmp/github-secrets.env

      - name: Deploy and merge secrets.env on server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: scripts/deploy/sync-secrets.py,/tmp/github-secrets.env
          target: /tmp/

      - name: Merge and apply on server
        uses: appleboy/ssh-action@v1.3.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            python3 /tmp/sync-secrets.py --merge ~/.config/devforge/secrets.env > ~/.config/devforge/secrets.env.new
            mv ~/.config/devforge/secrets.env.new ~/.config/devforge/secrets.env
            chmod 600 ~/.config/devforge/secrets.env

      - name: Restart containers
        uses: appleboy/ssh-action@v1.3.0
        if: always()
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            systemctl --user restart container-devforge-fastapi container-devforge-mcp container-devforge-worker 2>/dev/null || true
