# ARM Grabber configuration
# Copy to arm-grabber.yaml and fill in your values
oci:
  region: ap-chuncheon-1
  availability_domain: AP-CHUNCHEON-1-AD-1
  compartment_id: ""
  subnet_id: ""
  image_id: ""
  ssh_public_key: ""
  display_name: devforge

shapes:
  direct_ocpus: 4
  direct_memory_gb: 24
  small_ocpus: 1
  small_memory_gb: 6
  target_ocpus: 4
  target_memory_gb: 24
  boot_volume_size: 50

timing:
  direct_wait: 900
  small_wait: 900
  resize_timeout: 300
  resize_retries: 5
  resize_retry_delay: 60
  off_peak_hours: [0, 1, 2, 3, 4, 5]
  off_peak_wait: 30
  peak_wait: 300

notify:
  smtp_user: ""
  smtp_password: ""
  smtp_to: ""
  on_success: true
  on_failure: true
  status_report: true
