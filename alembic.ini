# Alembic configuration for DevForge
# Generated during Phase 0.4 refactoring

[alembic]
script_location = alembic
prepend_syslen = 5
version_path_separator = os
# Input file encoding
input_encoding = utf-8
# Output file encoding
output_encoding = utf-8

# Database URL — override with DEVFORGE_DATABASE_URL env var
sqlalchemy.url = driver://

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
