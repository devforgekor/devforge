# DevForge Timer Registry — machine-readable schedule of all systemd timers
# Auto-generated by Phase 6 of machine-readability overhaul (2026-05-23)
# Update when adding/removing timers

timers:
  - timer: server-state-collector.timer
    schedule: every 15min
    service: server-state-collector.service
    script: scripts/state_collector/main.py
    purpose: server state collection, changelog, CLAUDE.yaml update, MOTD generation, phase tracking

  - timer: devforge-collect.timer
    schedule: every 15min
    service: devforge-collect.service
    script: scripts/collect_turns.py
    purpose: collect conversation turns from Claude Code, Copilot, Gemini, Aider sessions

  - timer: handover-gen.timer
    schedule: every 10min
    service: handover-gen.service
    script: scripts/update_handover.py
    purpose: scan recent files and git status, update handover.yaml

  - timer: devforge-nightly.timer
    schedule: daily at 18:00 UTC (KST 03:00)
    service: devforge-nightly.service
    script: scripts/nightly_batch.sh
    purpose: link turns to worklog, embed turns (pgvector), nightly status

  - timer: devforge-backup.timer
    schedule: daily at 20:00 UTC (KST 05:00)
    service: devforge-backup.service
    script: /usr/local/bin/dump_postgres.sh
    purpose: PostgreSQL pg_dump backup

  - timer: devforge-restore-test.timer
    schedule: monthly 1st at 20:30 UTC (KST 05:30)
    service: devforge-restore-test.service
    script: /usr/local/bin/test_dump_restore.sh
    purpose: monthly backup restore verification

  - timer: review-worker.timer
    schedule: 3x daily at 22:05, 03:05, 08:05 UTC (KST 07:05, 12:05, 17:05)
    service: review-worker.service
    script: scripts/review_worker.py
    purpose: 3-LLM review pipeline during batch windows

  - timer: swap-batch.timer
    schedule: 3x daily at 22:00, 03:00, 08:00 UTC (KST 07:00, 12:00, 17:00)
    service: swap-batch.service
    script: scripts/swap_llm_mode.sh batch
    purpose: switch to batch mode (Phi-4 14B + Qwen32B)

  - timer: swap-normal.timer
    schedule: 3x daily at 23:00, 04:00, 09:00 UTC (KST 08:00, 13:00, 18:00)
    service: swap-normal.service
    script: scripts/swap_llm_mode.sh normal
    purpose: restore normal mode (Qwen3-4B)

  - timer: activity-summarizer.timer
    schedule: daily at 22:30 UTC (KST 07:30)
    service: activity-summarizer.service
    script: scripts/activity_summarizer.py
    purpose: LLM summarization of daily activity_log entries

  - timer: validate-gen.timer
    schedule: daily at 00:00 UTC (KST 09:00)
    service: validate-gen.service
    script: scripts/state_collector/main.py --validate
    purpose: compare CLAUDE.yaml and blueprint.yaml claims against live system state

  - timer: reference-monitor.timer
    schedule: weekly Monday at 10:00 UTC
    service: reference-monitor.service
    script: ~/.config/devforge/bin/rss-monitor
    purpose: GitHub RSS polling for reference watchlist updates

  - timer: devforge-refresh-reminder.timer
    schedule: 3x yearly (Apr 15, Aug 15, Dec 15) at 00:00 UTC
    service: devforge-refresh-reminder.service
    script: systemd-cat (echo reminder)
    purpose: 4-month cycle refresh reminder for reference tracking
