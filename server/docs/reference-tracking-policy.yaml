# reference-tracking-policy.yaml
# Version: 1.2.1 (DRY refactor)
# Last updated: 2026-05-13
# Purpose: Define rules for tracking upstream technology changes,
#          evaluating stability, and applying updates on a 4-month cycle
#          with migration difficulty considered, emergency CVE response, 
#          and concrete operational accountability.

metadata:
  document_name: "Reference Tracking Policy"
  version: "1.2.1"
  effective_date: "2026-05-13"
  maintainers:
    - role: "system owner"
      contact: "local"
  base_dir: "~/.config/devforge"
  refresh_cycle: "4 months"
  next_refresh_date: "2026-09-01"
  emergency_response_enabled: true
  policy_evolution_log: "historical/policy-log.md"

# ---------- Health Check Suite (defined once, referenced in step 6c) ----------
health_check_suite:
  purpose: "Verify all affected units after update; ALL checks must pass before proceeding"
  default_wait_time: "90 seconds (3 healthcheck cycles at 30s interval; adjust per service)"
  checks:
    - id: "unit_active"
      command: "systemctl --user is-active <unit>"
      expected_result: "active"
      purpose: "Confirm service started and stabilized"
      timeout: "immediate"

    - id: "healthcheck_passes"
      command: "journalctl --user -u <unit>-healthcheck.timer -n 3 --no-pager | grep -i 'success'"
      expected_result: "3 consecutive success lines within last 90 seconds"
      purpose: "Confirm service internal health over multiple cycles (not just startup)"
      timeout: "90–120 seconds (wait for 3 healthcheck cycles)"
      note: "If <unit> has no dedicated healthcheck.timer, skip this check and document in refresh-log.md"

    - id: "api_response"
      command: "curl -f -m 5 http://localhost:NNNN/health || exit 1"
      expected_result: "HTTP 200 within 5 seconds"
      purpose: "Verify external API responsiveness"
      timeout: "5 seconds"
      customization: "Adjust endpoint and timeout per service (e.g., postgres: pg_isready -h localhost, redis: redis-cli ping)"

    - id: "log_stability"
      command: "journalctl --user -u <unit> --since '2 minutes ago' | grep -iE '(CRITICAL|ERROR)' | wc -l"
      expected_result: "0 (no CRITICAL or ERROR messages in last 2 minutes)"
      purpose: "Confirm no cascading failures post-update"
      timeout: "immediate"

