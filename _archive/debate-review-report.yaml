    - "Add Phi-4 history summary before Round 5 (32B context overflow prevention)"
    - "Add DART search query dedup filter"
    - "Add winner mapping table (alpha/beta → actual model)"
    - "Use mlock=1 for Phi-4-14B in debate mode"
