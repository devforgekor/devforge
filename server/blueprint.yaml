target:
  architecture: 2-Container + Gemini Proxy (current, 2026-05-24)
  external:
  - name: azure-qwen
    role: Azure Spot VM — Qwen3-30B-A3B MoE on :400
    host: 20.219.32.210
    model: Qwen3-30B-A3B-Q4_K_M.gguf (18GB, official Qwen repo)
    server: llama.cpp llama-server (systemd)
    cpu: Intel Xeon Platinum 8573C (AVX512, AMX_INT8)
    ram: 42 GiB
    speed: ~6.5 tok/sec
    image: Azure Compute Gallery — img-qwen3-30b-a3b
    gallery: gallery_devforge_prod_cin
    version: 0.0.1
    image_capture_date: '2026-05-25'
    ssh: azureqwen (~/.ssh/vm-azure-qwen-30B-A3B-key.pem)
    doc: docs/azure-qwen-setup.md
    setup_date: '2026-05-25'
  containers:
  - name: devforge-qwen
    role: Podman A — Qwen3-4B on :8080 (currently DOWN after 32B code mode)
    model: Qwen3-4B-Q4_K_M.gguf
    memory_max: 6G
    ctx_size: 4096
  - name: devforge-swap
    role: 'Podman B — Mode-switchable on :8081-8082 (currently code mode: 32B)'
    modes:
      normal: Phi-4-mini Q8_0 :8081 + Llama-3.2-3B Q8_0 :8082 (review_worker full processing, orphan resolution active)
      batch: Phi-4 Q4_K_M (14B) :8081
      code: Qwen2.5-Coder-32B IQ4_XS :8081 (Podman A must be stopped, review_worker save-only, no LLM processing)
    memory_max: 26G
    processing_rules:
      normal_mode:
        models: Qwen3-4B:8080 + Phi-4-mini:8081 + Llama-3B:8082
        review_worker: ON — Full 3-LLM debate (Qwen+Llama parallel extract → Phi-4-mini arbitrate). Includes backfill of any
          turns accumulated during non-normal modes.
      batch_mode:
        models: Qwen3-4B:8080 + Phi-4 14B:8081 (Llama-3B unavailable)
        review_worker: OFF — No processing. Turns accumulate for backfill when normal mode resumes.
      code_mode:
        models: 32B:8081 only (Qwen3-4B STOPPED, Llama-3B STOPPED)
        review_worker: OFF — No processing. Turns accumulate for backfill when normal mode resumes.
      backfill:
        trigger: Normal mode resumed — review_worker detects unprocessed turns since last normal-mode run.
        method: 'Single pass: process all accumulated turns with standard 3-LLM debate pipeline. No chunking needed — not
          real-time data.'
        timer_restore: swap_mode.sh exit code/batch → restart review-worker.timer + devforge-nightly.timer
  - name: devforge-api
    role: Application server :8000
    type: systemd user / Quadlet container
  - name: postgres
    role: PostgreSQL 16 :5432 (pgvector 0.8.2, 10 tables, 4180 turns)
    type: systemd user / Quadlet container
  - name: gemini-proxy
    role: Gemini API key rotation proxy :9099
    type: systemd user service (native Python)
  services:
  - name: caddy
    role: Reverse proxy (host network, auto-HTTPS)
  - name: netdata
    role: System monitoring :19999
  - name: gemini-proxy
    role: API key rotation + model auto-routing for Gemini free tier
  embedding:
    engine: gemini-embedding-001
    dim: 768
    indexed: 1015
    remaining: 3165
    table: turns.embedding vector(768) + HNSW index (vector_cosine_ops)
