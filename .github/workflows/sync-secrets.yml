name: Sync Secrets

# [WHY] Manual-only (2026-09-24): the old `push` on this file auto-ran the sync
# on any edit, which re-created ~/.config/devforge/secrets.env and restarted
# containers. Post-KV-migration that risks re-injecting stale plaintext secrets,
# so secret syncs are now deliberate (Actions → Run workflow).
on:
  workflow_dispatch:

env:
  DEVFORGE_SERVER_HOST: ${{ secrets.DEVFORGE_SERVER_HOST }}
  DEVFORGE_SERVER_USER: ${{ secrets.DEVFORGE_SERVER_USER }}

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Generate secrets.env from GitHub Secrets
        env:
          # Azure
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_SP_20137133_CLIENT_ID: ${{ secrets.AZURE_SP_20137133_CLIENT_ID }}
          AZURE_SP_20137133_CLIENT_SECRET: ${{ secrets.AZURE_SP_20137133_CLIENT_SECRET }}
          AZURE_SP_20137133_TENANT_ID: ${{ secrets.AZURE_SP_20137133_TENANT_ID }}
          AZURE_SP_MINIPARK4U_CLIENT_ID: ${{ secrets.AZURE_SP_MINIPARK4U_CLIENT_ID }}
          AZURE_SP_MINIPARK4U_CLIENT_SECRET: ${{ secrets.AZURE_SP_MINIPARK4U_CLIENT_SECRET }}
          AZURE_SP_MINIPARK4U_TENANT_ID: ${{ secrets.AZURE_SP_MINIPARK4U_TENANT_ID }}
          AZURE_SP_KUHWADOCS_CLIENT_ID: ${{ secrets.AZURE_SP_KUHWADOCS_CLIENT_ID }}
          AZURE_SP_KUHWADOCS_CLIENT_SECRET: ${{ secrets.AZURE_SP_KUHWADOCS_CLIENT_SECRET }}
          AZURE_SP_KUHWADOCS_TENANT_ID: ${{ secrets.AZURE_SP_KUHWADOCS_TENANT_ID }}
          AZURE_SP_MESIDS_CLIENT_ID: ${{ secrets.AZURE_SP_MESIDS_CLIENT_ID }}
          AZURE_SP_MESIDS_CLIENT_SECRET: ${{ secrets.AZURE_SP_MESIDS_CLIENT_SECRET }}
          AZURE_SP_MESIDS_TENANT_ID: ${{ secrets.AZURE_SP_MESIDS_TENANT_ID }}
          # Brave
          BRAVE_MESIDS_API_KEY: ${{ secrets.BRAVE_MESIDS_API_KEY }}
          BRAVE_MINIPARK4U_API_KEY: ${{ secrets.BRAVE_MINIPARK4U_API_KEY }}
          BRAVE_HYEONMINPARK4U_API_KEY: ${{ secrets.BRAVE_HYEONMINPARK4U_API_KEY }}
          BRAVE_PLAYPARK4U_API_KEY: ${{ secrets.BRAVE_PLAYPARK4U_API_KEY }}
          # Context7
          CONTEXT7_MESIDS_API_KEY: ${{ secrets.CONTEXT7_MESIDS_API_KEY }}
          CONTEXT7_MINIPARK4U_API_KEY: ${{ secrets.CONTEXT7_MINIPARK4U_API_KEY }}
          CONTEXT7_HYEONMINPARK4U_API_KEY: ${{ secrets.CONTEXT7_HYEONMINPARK4U_API_KEY }}
          CONTEXT7_PLAYPARK4U_API_KEY: ${{ secrets.CONTEXT7_PLAYPARK4U_API_KEY }}
          # DataImpulse
          DATAIMPULSE_PROXY_KEY: ${{ secrets.DATAIMPULSE_PROXY_KEY }}
          # DeepSeek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # DevForge
          DEVFORGE_ENCRYPTION_PASSPHRASE: ${{ secrets.DEVFORGE_ENCRYPTION_PASSPHRASE }}
          DEVFORGE_LITELLM_MASTER_KEY: ${{ secrets.DEVFORGE_LITELLM_MASTER_KEY }}
          DEVFORGE_POSTGRES_PASSWORD: ${{ secrets.DEVFORGE_POSTGRES_PASSWORD }}
          # Droplr
          DROPLR_USER: ${{ secrets.DROPLR_USER }}
          DROPLR_PASS: ${{ secrets.DROPLR_PASS }}
          # DuckDNS
          DUCKDNS_TOKEN_KEY: ${{ secrets.DUCKDNS_TOKEN_KEY }}
          # Exa
          EXA_MESIDS_API_KEY: ${{ secrets.EXA_MESIDS_API_KEY }}
          EXA_MINIPARK4U_API_KEY: ${{ secrets.EXA_MINIPARK4U_API_KEY }}
          EXA_HYEONMINPARK4U_API_KEY: ${{ secrets.EXA_HYEONMINPARK4U_API_KEY }}
          EXA_PLAYPARK4U_API_KEY: ${{ secrets.EXA_PLAYPARK4U_API_KEY }}
          # Gemini
          GEMINI_MESIDS_API_KEY: ${{ secrets.GEMINI_MESIDS_API_KEY }}
          GEMINI_MINIPARK4U_API_KEY: ${{ secrets.GEMINI_MINIPARK4U_API_KEY }}
          GEMINI_HYEONMINPARK4U_API_KEY: ${{ secrets.GEMINI_HYEONMINPARK4U_API_KEY }}
          GEMINI_PLAYPARK4U_API_KEY: ${{ secrets.GEMINI_PLAYPARK4U_API_KEY }}
          # Gmail
          GMAIL_SMTP_MINIPARK4U: ${{ secrets.GMAIL_SMTP_MINIPARK4U }}
          # Gudokpin
          GUDOKPIN_API_KEY: ${{ secrets.GUDOKPIN_API_KEY }}
          # HuggingFace
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # Maskproxy
          MASKPROXY_API_KEY: ${{ secrets.MASKPROXY_API_KEY }}
          MASKPROXY_PROXY_KEY: ${{ secrets.MASKPROXY_PROXY_KEY }}
          # GitHub
          MY_COPILOT_GITHUB_TOKEN_KEY: ${{ secrets.MY_COPILOT_GITHUB_TOKEN_KEY }}
          MY_GITHUB_TOKEN_KEY: ${{ secrets.MY_GITHUB_TOKEN_KEY }}
          # NEIS
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          # Notion
          NOTION_TOKEN_KEY: ${{ secrets.NOTION_TOKEN_KEY }}
          # OCI
          OCI_MESIDS_API_KEY_FINGERPRINT: ${{ secrets.OCI_MESIDS_API_KEY_FINGERPRINT }}
          OCI_MESIDS_DOMAIN_OCID: ${{ secrets.OCI_MESIDS_DOMAIN_OCID }}
          OCI_MESIDS_REGION: ${{ secrets.OCI_MESIDS_REGION }}
          OCI_MESIDS_TENANCY_OCID: ${{ secrets.OCI_MESIDS_TENANCY_OCID }}
          OCI_MESIDS_USER_OCID: ${{ secrets.OCI_MESIDS_USER_OCID }}
          # OpenRouter
          OPENROUTER_HYEONMINPARK4U_API_KEY: ${{ secrets.OPENROUTER_HYEONMINPARK4U_API_KEY }}
          OPENROUTER_MESIDS_API_KEY: ${{ secrets.OPENROUTER_MESIDS_API_KEY }}
          OPENROUTER_MINIPARK4U_API_KEY: ${{ secrets.OPENROUTER_MINIPARK4U_API_KEY }}
          # Slack
          SLACK_BOT_TOKEN_KEY: ${{ secrets.SLACK_BOT_TOKEN_KEY }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_SIGNING_SECRET_KEY: ${{ secrets.SLACK_SIGNING_SECRET_KEY }}
          # Telegram
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST_TOKEN_KEY: ${{ secrets.TELEGRAM_TEST_TOKEN_KEY }}
          TELEGRAM_TOKEN_KEY: ${{ secrets.TELEGRAM_TOKEN_KEY }}
          # Travily
          TRAVILY_MESIDS_GITHUB_API_KEY: ${{ secrets.TRAVILY_MESIDS_GITHUB_API_KEY }}
          TRAVILY_MINIPARK4U_API_KEY: ${{ secrets.TRAVILY_MINIPARK4U_API_KEY }}
          TRAVILY_HYEONMINPARK4U_API_KEY: ${{ secrets.TRAVILY_HYEONMINPARK4U_API_KEY }}
          TRAVILY_PLAYPARK4U_API_KEY: ${{ secrets.TRAVILY_PLAYPARK4U_API_KEY }}
          # Vercel
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_REVALIDATE_TOKEN_KEY: ${{ secrets.VERCEL_REVALIDATE_TOKEN_KEY }}
          VERCEL_TOKEN_KEY: ${{ secrets.VERCEL_TOKEN_KEY }}
          # YOUCOM
          YOUCOM_MESIDS_API_KEY: ${{ secrets.YOUCOM_MESIDS_API_KEY }}
          YOUCOM_MINIPARK4U_API_KEY: ${{ secrets.YOUCOM_MINIPARK4U_API_KEY }}
          YOUCOM_HYEONMINPARK4U_API_KEY: ${{ secrets.YOUCOM_HYEONMINPARK4U_API_KEY }}
          YOUCOM_PLAYPARK4U_API_KEY: ${{ secrets.YOUCOM_PLAYPARK4U_API_KEY }}
          # Zight
          ZIGHT_API_KEY: ${{ secrets.ZIGHT_API_KEY }}
        run: |
          python3 scripts/deploy/sync-secrets.py > scripts/deploy/github-secrets.env
          wc -l scripts/deploy/github-secrets.env

      - name: Backup existing secrets.env
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEVFORGE_SERVER_HOST }}
          username: ${{ env.DEVFORGE_SERVER_USER }}
          key: ${{ secrets.DEVFORGE_SERVER_SSH_KEY }}
          script: |
            cp ~/.config/devforge/secrets.env ~/.config/devforge/secrets.env.bak.$(date +%Y%m%d%H%M%S) 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-secrets
          path: scripts/deploy/github-secrets.env

      - name: Encode secrets
        id: encode
        run: |
          echo "secrets_b64=$(base64 -w0 scripts/deploy/github-secrets.env)" >> $GITHUB_OUTPUT

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEVFORGE_SERVER_HOST }}
          username: ${{ env.DEVFORGE_SERVER_USER }}
          key: ${{ secrets.DEVFORGE_SERVER_SSH_KEY }}
          envs: SECRETS_B64
          script: |
            echo "$SECRETS_B64" | base64 -d > /tmp/github-secrets.env
            wc -l /tmp/github-secrets.env
        env:
          SECRETS_B64: ${{ steps.encode.outputs.secrets_b64 }}

      - name: Merge and apply on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEVFORGE_SERVER_HOST }}
          username: ${{ env.DEVFORGE_SERVER_USER }}
          key: ${{ secrets.DEVFORGE_SERVER_SSH_KEY }}
          script: |
            python3 - <<'EOF'
            import os
            gh = {}
            gh_path = "/tmp/github-secrets.env"
            if os.path.exists(gh_path):
                with open(gh_path) as f:
                    for line in f:
                        line = line.strip()
                        if line and "=" in line:
                            k, v = line.split("=", 1)
                            gh[k] = v
            path = os.path.expanduser("~/.config/devforge/secrets.env")
            data = {}
            with open(path) as f:
                for line in f:
                    line = line.rstrip("\n")
                    if line and "=" in line and not line.startswith("#"):
                        k, v = line.split("=", 1)
                        data[k] = v
            data.update(gh)
            with open(path, "w") as f:
                for k, v in data.items():
                    f.write(f"{k}={v}\n")
            os.chmod(path, 0o600)
            print(f"merged {len(gh)} github secrets into {path}")
            EOF

      - name: Restart containers
        uses: appleboy/ssh-action@v1.2.5
        if: always()
        with:
          host: ${{ env.DEVFORGE_SERVER_HOST }}
          username: ${{ env.DEVFORGE_SERVER_USER }}
          key: ${{ secrets.DEVFORGE_SERVER_SSH_KEY }}
          script: |
            systemctl --user restart container-devforge-fastapi container-devforge-mcp container-devforge-worker openrouter-rr-proxy 2>/dev/null || true
