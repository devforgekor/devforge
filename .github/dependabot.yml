version: 2
updates:
  # Python dependencies — updates uv.lock (+ matching pins in pyproject.toml).
  # Minor/patch are grouped; majors open individually for review.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]

  # GitHub Actions — bumps the SHA pins in .github/workflows (keeps the # vX comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]

  # Dockerfile base image (python:3.12-slim).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
