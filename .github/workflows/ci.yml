name: CI

# Actions are pinned to commit SHAs (not mutable tags) per supply-chain policy.
# Rationale: CVE-2026-33634 — trivy-action version tags were force-pushed to
# credential-stealing malware (2026-03). Pinning prevents tag-move attacks.
# Update SHAs deliberately; Dependabot `github-actions` may bump them.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: default GITHUB_TOKEN is read-only; jobs opt in as needed.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Verify lockfile is in sync
        run: uv lock --check
      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev
      - name: Ruff (lint)
        run: uv run --frozen ruff check src/ tests/ --output-format=concise
      - name: Ruff (format check)
        run: uv run --frozen ruff format --check src/

  type-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev
      - name: Mypy (strict)
        run: uv run --frozen python -m mypy src/ --ignore-missing-imports

  architecture:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev
      - name: Import Linter
        run: uv run --frozen lint-imports

  dependency-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev
      - name: pip-audit (dependency vulnerabilities)
        # PYSEC-2026-1845: pytest<9 local /tmp DoS — dev-only tooling, not shipped
        # in the image. Accepted risk; remove after the pytest 9 migration.
        run: uv run --frozen --with pip-audit pip-audit --desc --ignore-vuln PYSEC-2026-1845

  # dependency-review is disabled: the repository's Dependency graph is off, so
  # the action errors ("not supported on this repository") and blocks every PR.
  # Re-enable (Settings → Code security → Dependency graph) then restore this job:
  #   dependency-review:
  #     runs-on: ubuntu-latest
  #     if: github.event_name == 'pull_request'
  #     permissions: { contents: read, pull-requests: write }
  #     steps:
  #       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  test:
    runs-on: ubuntu-latest
    needs: [type-check, architecture]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devforge
          POSTGRES_PASSWORD: devforge_app_2026
          POSTGRES_DB: devforge_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: |
          uv run --frozen pytest tests/fitness/ tests/test_characterization.py tests/test_integration.py -v --tb=short
        env:
          DEVFORGE_DATABASE_URL: postgresql+asyncpg://devforge:devforge_app_2026@localhost:5432/devforge_app

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, architecture, dependency-scan, test]
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless signing + provenance attestation (OIDC)
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: latest
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
      # Fail on fixable CRITICAL/HIGH image vulnerabilities (policy 1p).
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
