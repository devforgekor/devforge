    items:
      - "devforge-llm systemd user service"
      - "Migrate llm-coder from podman run to systemd unit"
      - "llama-server flags: --threads 4 --threads-batch 4 --ctx-size 16384 --flash-attn on --cache-reuse 256 --host 0.0.0.0 --port 8080"
