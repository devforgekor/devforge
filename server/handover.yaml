  - Initial backup tar hit root fs 92% full; skipped full backup, targeted critical data only
decisions:
- 'Reboot verification 2026-05-11T14:10 KST: all services verified, 3 issues found and resolved.'
- 'Normalization pass 2026-05-11T14:35 KST: 3 workarounds properly fixed — (1) netdata RPM fully removed via dnf, (2) --mlock
  flag removed from container-devforge-llm.service (rootless podman lacks CAP_IPC_LOCK, model works fine without it, swappiness=10),
  (3) LiteLLM connected to postgres via devforge-net bridge (listen_addresses=*, pg_hba 10.89.0.0/24, litellm DB created,
  database_url in config.yaml) → /health now returns healthy_count=1 unhealthy_count=0.'
- 'Quadlet cleanup: 6 stale .container/.pod/.network files removed from ~/.config/containers/systemd/ — Quadlet was abandoned
  for podman generate systemd in DevForge v3.0, leftover files caused llm.service conflict on boot.'
- 'ai-pod auto-start fix 2026-05-11T14:15 KST: pod-ai-pod.service + pod-data-pod.service both patched. Root cause: reboot
  clears /run tmpfs but podman DB retains stale pod records → pod create --replace races with DB cleanup → FOREIGN KEY constraint
  / no such pod errors → containers fail with dependency failure on BindsTo. Fix: (1) explicit ExecStartPre=-podman pod rm
  -f --ignore <name> before pod create, (2) drop --replace flag, (3) RestartSec=3s added. Simulated cold start test passed
  — both pods started on first attempt.'
- 'postgres networking: listen_addresses changed from 127.0.0.1 to * (in postgresql.conf, persisted on /mnt/lv_db volume)
  with pg_hba.conf entry for devforge-net subnet (10.89.0.0/24 trust). Enables cross-pod connectivity from litellm@ai-pod
  to postgres@data-pod over bridge network. Pod DNS resolves data-pod hostname.'
