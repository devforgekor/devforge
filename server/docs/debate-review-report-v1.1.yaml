# Reviewers: Claude/DeepSeek, Qwen3.6, AI Assistant
# Date: 2026-05-24
# =============================================================================

meta:
  spec_version: "1.1"
  reviewers: ["Claude/DeepSeek", "Qwen3.6", "AI Assistant"]
  review_method: "Independent blind review → consolidated synthesis"
  overall_verdict: "APPROVED FOR PHASE 3 IMPLEMENTATION — Production-ready, zero blocking issues"
  spec_fixes_applied_during_review: 3

# =============================================================================
# 1. CONSENSUS: UNANIMOUS AGREEMENT (3/3 reviewers)
# =============================================================================
consensus:
  - topic: "Supervisor-based hot-swap is the correct architecture"
    verdict: >
      Eliminating container restart is the single most impactful improvement
      from v1.0. The grep/sed JSON parsing (no python3 dependency) is elegant.
      Supervisor v1.0 validation gives high confidence for Phase 3.
    reviewers: [3/3]
    action: "Keep as-is. Supervisor is ready for orchestrator integration."

  - topic: "All D1-D8 review decisions correctly incorporated"
    verdict: >
      Every review question from v1.0 is now RESOLVED with clear rationale.
      The spec is a complete, self-contained design document.
    reviewers: [3/3]
    action: "No changes needed to design decisions."

  - topic: "Phi-4 history summary (A2/D6) is critical-path"
    verdict: >
      This is the key safety mechanism preventing 32B context overflow.
      Must be implemented in Phase 3, not deferred.
    reviewers: [3/3]
    action: "Implement as Round 5 pre-step. Non-negotiable."

  - topic: "Winner Mapping table (A4/F4) is essential for debate integrity"
    verdict: >
      Blind judging is useless without post-hoc winner identification.
      Mapping MUST be logged BEFORE shuffle — all 3 reviewers emphasize this.
    reviewers: [3/3]
    action: "Implement C-prime phase in debate.py judge handler."

  - topic: "DART dedup filter (A3/F2) prevents API waste"
    verdict: >
      Near-identical search queries are a real risk during low-consensus rounds.
      Token-overlap filter is simple and effective.
    reviewers: [3/3]
    action: "Implement before search execution in DART trigger handler."

  - topic: "22GB RAM budget is safe with sequential execution"
    verdict: >
      All models fit individually (8.5-17GB RSS vs 22GB total).
      Worst case (32B at 17GB) leaves 3.5GB for system + ZRAM.
      No OOM risk.
    reviewers: [3/3]
    action: "Keep current memory budget. Monitor RSS during Phase 6 testing."

  - topic: "Spec is ready for Phase 3 implementation"
    verdict: "No blocking issues remain. All three reviewers independently APPROVE."
    reviewers: [3/3]
    action: "Proceed to Phase 3 — Orchestrator Implementation."

# =============================================================================
# 2. SPEC ISSUES FOUND AND FIXED DURING REVIEW
# =============================================================================
fixes_applied:
  - id: "FIX-1"
    source: "Claude/DeepSeek"
    severity: "low"
    topic: "Section 12 CLI flow still references container restart"
    before: "debate.py restarts container-devforge-swap per round"
    after: "debate.py writes model-switch.json → supervisor hot-swaps WITHOUT container restart"
    status: "FIXED in v1.1"
    note: "Documentation drift from v1.0 → v1.1 rewrite."

  - id: "FIX-2"
    source: "Claude/DeepSeek"
    severity: "low"
    topic: "Best case timing overstated at 7 minutes"
    detail: >
      Best case (R0 + R1 + early-exit + R5) = 272+197+220 = 689s = 11.5 min.
      Original claim of 7 min required DRAG skip + early exit at R2.
    fix: >
      Added explicit best_case_minutes: 11 (with DRAG) and
      best_case_drag_skipped_minutes: 7 (DRAG skipped).
      Calculation now documented inline: 272+197+220=689s.
    status: "FIXED in v1.1"

  - id: "FIX-3"
    source: "Claude/DeepSeek"
    severity: "low"
    topic: "DART trigger missing null/empty query guard"
    detail: >
      If judge returns suggested_search_query: null or "",
      the orchestrator would still count it as a search attempt.
    fix: >
      Added condition: suggested_search_query NOT IN (null, "", "none", "null").
      skip_if clause updated to include empty query check.
    status: "FIXED in v1.1"

# =============================================================================
# 3. IMPLEMENTATION GUIDANCE (from all reviewers)
# =============================================================================
implementation_guidance:

  python_timeout:
    topic: "LLM HTTP request timeout must be generous"
    recommendation: >
      Use timeout=300 (5 minutes) for all LLM API calls.
      DeepCoder with <think> chain can take 2-3 minutes for a single response.
      Default requests library timeout is too short and will cause
      premature disconnection mid-inference.
    source: "All 3 reviewers"
    code: |
      # In debate.py call_llm():
      response = requests.post(
          f"http://127.0.0.1:{port}/v1/chat/completions",
          json=payload,
          timeout=300  # 5 min — DeepCoder <think> chain can be slow
      )

  health_poll_backoff:
    topic: "Health check polling should use backoff"
    recommendation: >
      Start with 2s interval, increase to 4s, 8s (exponential backoff).
      Cap at 8s. Total timeout 240s unchanged.
    source: "Qwen3.6"
    rationale: "Reduces log spam during long model loads. Network/disk I/O variance handled gracefully."

  json_recovery:
    topic: "JSON parse failure recovery"
    recommendation: >
      1st: json.loads(raw)
      2nd: regex extract last complete { } block → json.loads
      3rd: re-prompt with "STRICT JSON ONLY" (1 retry max)
      On failure: log raw response, skip round, continue session.
    source: "Qwen3.6, Claude/DeepSeek"

  deepcoder_monitoring:
    topic: "Track <think> chain truncation"
    recommendation: >
      After each DeepCoder response, check if </think> tag exists
      without matching <think> or vice versa. If truncation detected,
      increase max_tokens to 16384 for subsequent calls.
      Log truncation events for post-session analysis.
    source: "All 3 reviewers"

  search_fallback:
    topic: "API failover: Tavily → SerpAPI → skip"
    recommendation: >
      Tavily primary, SerpAPI secondary. If both fail, log warning
      and continue debate without search. Never block round on API failure.
    source: "Claude/DeepSeek"

