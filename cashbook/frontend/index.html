<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현금출납부</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Login -->
  <div id="login-view" class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
      <h1 class="text-xl font-bold text-center mb-6">현금출납부</h1>
      <div id="login-error" class="text-red-500 text-sm text-center mb-4 hidden"></div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
          <input type="password" id="api-key" placeholder="비밀번호 입력"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                 autofocus>
        </div>
        <button onclick="doLogin()"
                class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">
          접속
        </button>
      </div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app-view" class="hidden">
    <nav class="bg-white shadow-sm border-b">
      <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <span class="text-lg font-bold text-gray-800">현금출납부</span>
        <button onclick="doLogout()" class="text-sm text-gray-500 hover:text-gray-700">로그아웃</button>
      </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-6">
      <div id="cashbook-root"></div>
    </main>
  </div>

<script>
const API = {
  baseUrl: 'https://devforge.152-69-229-246.nip.io/cashbook',
  apiKey: '',

  async request(method, path, body) {
    const url = `${this.baseUrl}${path}?key=${encodeURIComponent(this.apiKey)}`;
    const opts = { method, headers: {} };
    if (body) {
      if (body instanceof FormData) {
        opts.body = body;
      } else {
        opts.headers['Content-Type'] = 'application/x-www-form-urlencoded';
        opts.body = new URLSearchParams(body).toString();
      }
    }
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  },

  getCashbook()       { return this.request('GET', '/api/cashbook'); },
  addDeposit(d)       { return this.request('POST', '/api/deposit', d); },
  editDeposit(id, d)  { return this.request('PUT', `/api/deposit/${id}`, d); },
  delDeposit(id)      { return this.request('DELETE', `/api/deposit/${id}`); },
  addWithdrawal(d)    { return this.request('POST', '/api/withdrawal', d); },
  editWithdrawal(id, d){ return this.request('PUT', `/api/withdrawal/${id}`, d); },
  delWithdrawal(id)   { return this.request('DELETE', `/api/withdrawal/${id}`); },
};

function doLogin() {
  API.apiKey = document.getElementById('api-key').value;
  localStorage.setItem('cb_key', API.apiKey);
  loadCashbook();
}

function doLogout() {
  localStorage.removeItem('cb_key');
  document.getElementById('app-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
}

function fmt(n) {
  return '₩' + Number(n).toLocaleString();
}

// Date format: YY.MM.DD.
function toDisplayDate(dateStr) {
  if (!dateStr) return '';
  // Already in YY.MM.DD. format
  if (/^\d{2}\.\d{2}\.\d{2}\.$/.test(dateStr)) return dateStr;
  // Convert from YYYY-MM-DD or other formats
  const m = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1].slice(2) + '.' + m[2] + '.' + m[3] + '.';
  return dateStr;
}

function toISODate(displayDate) {
  if (!displayDate) return '';
  const m = displayDate.match(/(\d{2})\.(\d{2})\.(\d{2})\.?/);
  if (m) return '20' + m[1] + '-' + m[2] + '-' + m[3];
  return displayDate;
}

function formatDateInput(val) {
  // Auto-format as user types: 260414 -> 26.04.14.
  let v = val.replace(/[^\d]/g, '');
  if (v.length > 6) v = v.slice(0, 6);
  if (v.length >= 5) return v.slice(0,2) + '.' + v.slice(2,4) + '.' + v.slice(4) + (v.length === 6 ? '.' : '');
  if (v.length >= 3) return v.slice(0,2) + '.' + v.slice(2);
  return v;
}

function dateInputHTML(id, value, cls) {
  const dispVal = toDisplayDate(value);
  const isoVal = toISODate(dispVal);
  return `<div class="date-cell">
    <input type="text" value="${esc(dispVal)}" placeholder="YY.MM.DD."
           class="edit-input flex-1 ${cls}" data-field="date" data-id="${id}" data-type=""
           oninput="this.value=formatDateInput(this.value)">
    <button type="button" class="date-btn" onclick="openDatePicker(this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </button>
    <input type="date" class="hidden-date" value="${isoVal}"
           onchange="onDatePicked(this)">
  </div>`;
}

function dateInputHTMLNew(id, cls) {
  return `<div class="date-cell">
    <input type="text" value="" placeholder="YY.MM.DD."
           class="edit-input flex-1 ${cls}" id="${id}">
    <button type="button" class="date-btn" onclick="openDatePicker(this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </button>
    <input type="date" class="hidden-date" onchange="onDatePickedNew(this, '${id}')">
  </div>`;
}

function openDatePicker(btn) {
  const hidden = btn.parentElement.querySelector('.hidden-date');
  hidden.showPicker?.();
}

function onDatePicked(hiddenInput) {
  const textInput = hiddenInput.parentElement.querySelector('input[type=text]');
  if (hiddenInput.value) {
    const parts = hiddenInput.value.split('-');
    textInput.value = parts[0].slice(2) + '.' + parts[1] + '.' + parts[2] + '.';
  }
  textInput.dispatchEvent(new Event('change'));
}

function onDatePickedNew(hiddenInput, textId) {
  const textInput = document.getElementById(textId);
  if (hiddenInput.value) {
    const parts = hiddenInput.value.split('-');
    textInput.value = parts[0].slice(2) + '.' + parts[1] + '.' + parts[2] + '.';
  }
}

function render(cb) {
  const maxR = Math.max(cb.deposits.length, cb.withdrawals.length, 1);
  let html = `<table class="cashbook-table">
    <thead>
      <tr class="bg-gray-100 text-xs font-semibold text-gray-600 uppercase">
        <th colspan="3" class="border px-2 py-2 text-center bg-blue-50">입금</th>
        <th colspan="3" class="border px-2 py-2 text-center bg-red-50">출금</th>
        <th colspan="3" class="border px-2 py-2 text-center bg-green-50">결산</th>
      </tr>
      <tr class="bg-gray-50 text-xs text-gray-500">
        <th class="border px-2 py-1 col-date">일자</th>
        <th class="border px-2 py-1 col-amount">금액</th>
        <th class="border px-2 py-1 col-text">비고</th>
        <th class="border px-2 py-1 col-date">일자</th>
        <th class="border px-2 py-1 col-amount">금액</th>
        <th class="border px-2 py-1 col-text">사용처</th>
        <th class="border px-2 py-1 col-settle">입금</th>
        <th class="border px-2 py-1 col-settle">출금</th>
        <th class="border px-2 py-1 col-settle">총액</th>
      </tr>
    </thead><tbody>`;

  for (let i = 0; i < maxR; i++) {
    html += '<tr class="border-b">';
    // Deposit
    if (i < cb.deposits.length) {
      const d = cb.deposits[i];
      html += `<td class="border px-0 py-0" colspan="3">
        <form class="flex" onsubmit="return false">
          ${dateInputHTML(d.id, d.date, '')}
          <input type="number" value="${d.amount}" class="edit-input col-amount text-right border-r" data-field="amount" data-id="${d.id}" data-type="deposit">
          <input type="text" value="${esc(d.notes)}" class="edit-input col-text border-r" data-field="notes" data-id="${d.id}" data-type="deposit">
          <button type="button" class="btn-icon text-red-400 hover:text-red-600 text-xs px-1 self-center" onclick="delDeposit('${d.id}')">X</button>
        </form></td>`;
    } else {
      html += '<td class="border" colspan="3"></td>';
    }
    // Withdrawal
    if (i < cb.withdrawals.length) {
      const w = cb.withdrawals[i];
      html += `<td class="border px-0 py-0" colspan="3">
        <form class="flex" onsubmit="return false">
          ${dateInputHTML(w.id, w.date, '')}
          <input type="number" value="${w.amount}" class="edit-input col-amount text-right border-r" data-field="amount" data-id="${w.id}" data-type="withdrawal">
          <input type="text" value="${esc(w.vendor)}" class="edit-input col-text border-r" data-field="vendor" data-id="${w.id}" data-type="withdrawal">
          <button type="button" class="btn-icon text-red-400 hover:text-red-600 text-xs px-1 self-center" onclick="delWithdrawal('${w.id}')">X</button>
        </form></td>`;
    } else {
      html += '<td class="border" colspan="3"></td>';
    }
    // Settlement
    if (i === 0) {
      const balCls = cb.balance >= 0 ? 'text-green-700' : 'text-red-700';
      html += `<td class="border px-2 py-2 text-right text-green-700 font-semibold bg-green-50/50 col-settle">${fmt(cb.total_deposit)}</td>
        <td class="border px-2 py-2 text-right text-red-700 font-semibold bg-green-50/50 col-settle">${fmt(cb.total_withdrawal)}</td>
        <td class="border px-2 py-2 text-right font-bold bg-green-50/50 ${balCls} col-settle">${fmt(cb.balance)}</td>`;
    } else {
      html += '<td class="border col-settle"></td><td class="border col-settle"></td><td class="border col-settle"></td>';
    }
    html += '</tr>';
  }

  if (maxR === 1 && cb.deposits.length === 0 && cb.withdrawals.length === 0) {
    html += '<tr><td class="border px-3 py-8 text-center text-gray-400" colspan="9">데이터가 없습니다.</td></tr>';
  }

  // Add deposit row
  html += `<tr class="bg-blue-50/30"><td class="border px-0 py-0" colspan="3">
    <form class="flex" onsubmit="addDeposit(); return false">
      ${dateInputHTMLNew('new-dep-date', '')}
      <input type="number" id="new-dep-amount" placeholder="0" class="edit-input col-amount text-right border-r">
      <input type="text" id="new-dep-notes" placeholder="비고" class="edit-input col-text border-r">
      <button type="submit" class="text-blue-600 hover:text-blue-800 text-xs font-medium px-2 self-center whitespace-nowrap">+ 입금</button>
    </form></td>`;

  // Add withdrawal row
  html += `<td class="border px-0 py-0" colspan="3">
    <form class="flex" onsubmit="addWithdrawal(); return false">
      ${dateInputHTMLNew('new-wit-date', '')}
      <input type="number" id="new-wit-amount" placeholder="0" class="edit-input col-amount text-right border-r">
      <input type="text" id="new-wit-vendor" placeholder="사용처" class="edit-input col-text border-r">
      <button type="submit" class="text-red-600 hover:text-red-800 text-xs font-medium px-2 self-center whitespace-nowrap">+ 출금</button>
    </form></td>`;
  html += '<td class="border" colspan="3"></td></tr>';

  html += '</tbody></table>';
  document.getElementById('cashbook-root').innerHTML = html;

  // Attach change handlers
  document.querySelectorAll('.edit-input[data-id]').forEach(el => {
    el.addEventListener('change', () => handleEdit(el));
  });
}

function esc(s) { return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

async function handleEdit(el) {
  const { id, type, field } = el.dataset;
  const row = el.closest('form');
  const inputs = row.querySelectorAll('input');
  const data = {};
  inputs.forEach(i => {
    const f = i.dataset.field || i.name;
    if (f) data[f] = i.value;
  });
  // Format date before sending
  if (data.date) data.date = toDisplayDate(data.date);

  try {
    if (type === 'deposit') await API.editDeposit(id, data);
    else await API.editWithdrawal(id, data);
    await loadCashbook();
  } catch (e) { alert('저장 실패: ' + e.message); }
}

async function addDeposit() {
  const date = document.getElementById('new-dep-date').value;
  const amount = document.getElementById('new-dep-amount').value;
  const notes = document.getElementById('new-dep-notes').value;
  if (!date && !amount) return;
  await API.addDeposit({ date: toDisplayDate(date), amount: Number(amount), notes });
  await loadCashbook();
}

async function addWithdrawal() {
  const date = document.getElementById('new-wit-date').value;
  const amount = document.getElementById('new-wit-amount').value;
  const vendor = document.getElementById('new-wit-vendor').value;
  if (!date && !amount) return;
  await API.addWithdrawal({ date: toDisplayDate(date), amount: Number(amount), vendor });
  await loadCashbook();
}

async function delDeposit(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  await API.delDeposit(id);
  await loadCashbook();
}

async function delWithdrawal(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  await API.delWithdrawal(id);
  await loadCashbook();
}

async function loadCashbook() {
  try {
    const cb = await API.getCashbook();
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
    render(cb);
  } catch (e) {
    document.getElementById('login-error').textContent = '접속 실패: ' + e.message;
    document.getElementById('login-error').classList.remove('hidden');
    document.getElementById('app-view').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
  }
}

// Auto-login from localStorage
window.addEventListener('DOMContentLoaded', () => {
  const key = localStorage.getItem('cb_key');
  if (key) {
    document.getElementById('api-key').value = key;
    API.apiKey = key;
    loadCashbook();
  }
});
</script>
</body>
</html>
