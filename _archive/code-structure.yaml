# ── Data Flows ───────────────────────────────────────────────────────

data_flows:
  - name: "🔄 User → CLI → Pipeline → DB"
    path: "cli.py → orchestrator.py → code_mod_pipeline.py → diff → activity_log"
    description: "Code modification pipeline triggered by user CLI"

  - name: "🔄 User → CLI → Debate → Report"
    path: "cli.py → orchestrator.py → cooperative_debate.py/local_debate.py → report → activity_log"
    description: "Multi-agent debate triggered by user CLI"

  - name: "🔄 Turn Collection Pipeline"
    path: "turn_watcher.py (3s poll) → parsers/*.py → turns table → worklog_generator.py → worklog_entries"
    description: "Automated turn collection and worklog generation"

  - name: "🌙 Nightly Pipeline (KST 03:00)"
    path: "nightly_batch.sh → Phase 3(review_pipeline_3model) → Phase 5(27B verify) → Phase 7(proxy_reviewer → DeepSeek audit)"
    description: "Nightly review pipeline with 3-model review, verification, and DeepSeek audit"

  - name: "⏲️ System State (15min)"
    path: "state_collector/main.py → state.yaml → changelog (if changed) → CLAUDE.yaml → MOTD"
    description: "Periodic system state collection and change tracking"

  - name: "📝 Session Context (10min + hook)"
    path: "update_handover.py → handover.yaml"
    description: "Periodic and session-end context capture for LLM handover"

# ── Key Scripts Index ───────────────────────────────────────────────

entry_points:
  - script: "scripts/cli.py"
    command: "python3 scripts/cli.py {activity|worklog|mode|discussion|drag|toolmad}"
    description: "🎯 Main user-facing CLI"

  - script: "scripts/gen_architecture.py"
    trigger: "devforge-gen-architecture.timer (daily KST 09:00)"
    description: "🏗️ Auto-generate infrastructure.md + software.yaml from CLAUDE.yaml"

  - script: "scripts/state_collector/main.py"
    trigger: "server-state-collector.timer (15min)"
    description: "💾 Poll system state → state.yaml → changelog"

  - script: "scripts/update_handover.py"
    trigger: "handover-gen.timer (10min) + SessionEnd hook"
    description: "📝 Capture session context → handover.yaml"

  - script: "scripts/anthropic_proxy.py"
    trigger: "devforge-proxy.service (always on)"
    description: "🔄 DeepSeek ↔ Anthropic API proxy — always running"

  - script: "scripts/turn_watcher.py"
    trigger: "devforge-collect.timer"
    description: "👁️ Poll agent JSONL → turns table"

  - script: "scripts/nightly_batch.sh"
    trigger: "devforge-nightly.timer (UTC 18:00 = KST 03:00)"
    description: "🌙 Nightly pipeline orchestrator"

