# 8-stage code modification test for Qwen2.5-Coder-32B Q4_K_M
# Each task runs: Qwen32B local (4-stage pipeline) + 3 APIs for comparison
#
# Stage complexity: L1(simple add) → L8(analysis only)
# Target files: slack_operator.py (state machine + HTTP), auto_commit_guard.py (git + DB)
#
# Metrics per task:
#   - 32B: diff quality, rationale accuracy, confidence, review_points usefulness
#   - APIs: same metrics + token usage, latency
#   - Cross: agreement rate, unique insights per model

tasks:
  - id: 1
    stage: L1
    name: "Add Function (Simple)"
    file: "/opt/projects/server/api/slack_operator.py"
    description: |
      _post_to_slack() and _post_to_response_url() repeat the same JSON serialization+encoding pattern.
      Add a _encode_payload(payload: dict) -> bytes helper function that takes a payload dict and converts it to bytes.
      Modify existing _post_to_response_url() and _post_to_slack() to use this function.
    expected_category: "helper_extraction"
    evaluation:
      - Was the helper function extracted correctly?
      - Were both call sites modified?
      - Was existing behavior preserved?

  - id: 2
    stage: L2
    name: "Local Bug Fix"
    file: "/opt/projects/server/api/slack_operator.py"
    description: |
      _find_pid_file() selects the most recent file by mtime from glob results,
      but if another process deletes the file between glob and max(), a FileNotFoundError occurs.
      Modify so that it returns None if glob results are empty, and safely selects the most recent file if results exist.
      Also, it should return None instead of FileNotFoundError when PID_DIR does not exist.
    expected_category: "bug_fix"
    evaluation:
      - Was the race condition resolved?
      - Graceful handling when PID_DIR is absent
      - Existing return type (Optional[Path]) preserved

  - id: 3
    stage: L3
    name: "Add Error Handling/Validation"
    file: "/opt/projects/server/api/slack_operator.py"
    description: |
      When verify_slack_signature()'s body parameter is empty bytes (b''), if timestamp verification passes,
      hmac.compare_digest(expected, '') → True, which could allow an empty signature.
      Add input validation that explicitly returns False when body is empty, timestamp is 0,
      or signature does not match the 'v0=' format.
    expected_category: "validation"
    evaluation:
      - Empty body detection
      - Timestamp 0 defense
      - Signature format validation
      - No impact on existing normal cases

  - id: 4
    stage: L4
    name: "Cross-Function Modification"
    file: "/opt/projects/server/api/slack_operator.py"
    description: |
      cmd_status(), cmd_log(), and cmd_test_result() all use the same pattern of reading log/result files
      and truncating with _truncate(). These functions return different error messages on read failure;
      unify them with a consistent error format.
      Also extract a common _read_and_truncate(filepath: str, max_chars: int = 2500) -> str function
      and modify the three functions above to use it.
    expected_category: "cross_function_refactor"
    evaluation:
      - Accuracy of common function extraction
      - All three call sites modified
      - Error message consistency
      - cmd_test_result() JSON parsing case handling preserved

  - id: 5
    stage: L5
    name: "Intermediate Refactoring (Deduplication)"
    file: "/opt/projects/server/scripts/auto_commit_guard.py"
    description: |
      Multiple functions in auto_commit_guard.py execute git commands via the _git() helper,
      but each _git() call repeats the same error handling (return "" on failure) and strip().
      Analyze the _git() call pattern and improve it with a _git_or(default: str = "")
      pattern that allows specifying a default on failure. Also change the return type to
      Optional[str] so that cases where _git() result is an empty string can be distinguished
      from cases where actual git output is an empty string.
    expected_category: "deduplication"
    evaluation:
      - Optional[str] return type correctness
      - None checks added at call sites
      - Existing fallback behavior preserved

  - id: 6
    stage: L6
    name: "Interface Change"
    file: "/opt/projects/server/api/slack_operator.py"
    description: |
      The timeouts for _post_to_slack(), _update_slack_message(), and _post_to_response_url()
      are hardcoded at 10, 10, and 5 seconds respectively. Extract these values as module-level
      constants and change the interface so each function accepts a keyword argument
      timeout_override: Optional[int] = None, allowing callers to override the timeout.
      Define DEFAULT_SLACK_TIMEOUT = 10 and DEFAULT_RESPONSE_TIMEOUT = 5 constants.
    expected_category: "interface_change"
    evaluation:
      - Constant extraction accuracy
      - timeout_override parameter added
      - No change to default behavior
      - Type hints appropriateness

  - id: 7
    stage: L7
    name: "Structural Change (Class Extraction)"
    file: "/opt/projects/server/api/slack_operator.py"
    description: |
      The _interaction_state dict and the _get_state(), _prune_expired(), _state_key() functions
      form a single logical unit (SessionStore). Extract them into a SessionStore class.
      The class should have __init__(ttl: int = 1800), get(user_id, channel_id), and _prune() methods.
      Also update usage in _advance() and slack_interactions().
      Remove the existing module-level _interaction_state.
    expected_category: "structural_refactor"
    evaluation:
      - SessionStore class design appropriateness
      - All call sites migrated
      - TTL expiration behavior preserved
      - Thread-safety consideration

  - id: 8
    stage: L8
    name: "Analysis+Planning Only (No Code Modification)"
    file: "/opt/projects/server/scripts/auto_commit_guard.py"
    description: |
      Analyze the entire auto_commit_guard.py and identify race conditions and safety issues
      that may occur during concurrent execution. Specifically:
      1. Is log_commits_to_worklog() safe when two sessions call it simultaneously?
      2. Is the recovery behavior appropriate when psql() calls fail?
      3. Is the git log --since=24h window safe against DST/timezone changes?
      Do not modify code; output only discovered issues and recommended solutions as a markdown report.
    expected_category: "analysis_only"
    evaluation:
      - Race condition identification accuracy
      - Failure scenario coverage
      - Solution feasibility
      - Priority assignment appropriateness

  - id: 9
    stage: L9
    name: "Bug Fix — _fill_pool() Infinite Proliferation"
    file: "/opt/projects/server/scripts/gemini_pool.py"
    description: |
      GeminiPoolManager._fill_pool() is configured with min_size=2,
      and get() calls await self._fill_pool() on error.
      This causes new keys to be continuously added to the pool, resulting in an infinite proliferation bug.
      Keys returned by also_start_keys() are fetched from the DB, but failed existing keys are not removed,
      causing the pool size to grow uncontrollably.
      Modify _fill_pool() to add a max_size=4 limit and change it to remove failed keys from the pool.
    expected_category: "bug_fix"
    evaluation:
      - max_size limit added
      - Failed key removal logic
      - Pool size maintained at or below max_size

  - id: 10
    stage: L10
    name: "Concurrency Improvement — SQLite WAL Mode"
    file: "/opt/projects/server/scripts/gemini_pool.py"
    description: |
      GeminiPoolManager uses SQLite as a concurrency queue, causing write contention.
      When multiple coroutines simultaneously take the get() → _fill_pool() → _insert_key() path,
      they may fail with SQLITE_BUSY.
      Enable WAL mode (PRAGMA journal_mode=WAL) and add connection pooling.
      Set WAL mode during DB initialization, and change to sharing the aiosqlite connection at the module level.
    expected_category: "concurrency_fix"
    evaluation:
      - WAL mode enabled
      - Contention resolved on concurrent get() calls
      - Existing API compatibility preserved

  - id: 11
    stage: L11
    name: "Extract ASSERT Parser + Validator"
    file: "/opt/projects/server/scripts/code_mod_pipeline.py"
    description: |
      Port the extract_assert() and ASSERT validation logic from hybrid_pipeline.py's execute_steps()
      into code_mod_pipeline.py and generalize it as a lib module.
      Currently, code_mod_pipeline.py's 4-stage pipeline has no ASSERT validation.
      Extract an AssertValidator class that verifies each stage's output satisfies its contract
      into lib/assert_check.py, and apply it to code_mod_pipeline.py's Stage 3 (IMPL) results.

      --- Reference: extract_assert() from hybrid_pipeline.py ---
      def extract_assert(code: str) -> Optional[str]:
          m = re.search(r'#\s*ASSERT:\s*(.+)', code)
          return m.group(1).strip() if m else None

      Pattern: generated code includes "# ASSERT: <Python expr>" comments.
      After exec(code, namespace), eval(cond, namespace) checks the condition.
      Failed ASSERT → retry. TYPE_ENV → immediate abort, TYPE_CODE → retry up to 2x.

      The AssertValidator class should:
      - validate(stage_output: str, namespace: dict) -> (bool, Optional[str])
      - Return (True, None) if all ASSERTs pass, (False, reason) otherwise.
    expected_category: "feature_addition"
    evaluation:
      - AssertValidator class design
      - Stage 3 IMPL result validation applied
      - Existing pipeline behavior preserved
      - TYPE_ENV / TYPE_CODE error classification preserved

  - id: 12
    stage: L12
    name: "Generalize Error Classifier"
    file: "/opt/projects/server/scripts/code_mod_pipeline.py"
    description: |
      Port the classify_error() logic from hybrid_pipeline.py into code_mod_pipeline.py.
      Currently the 32B 4-stage pipeline treats all errors identically on stage failure.
      classify_error() distinguishes errors into TYPE_ENV (fatal, immediate abort) and TYPE_CODE (retryable).
      Extract this classification logic into lib/error_classifier.py and integrate it into
      code_mod_pipeline.py's Stage 2-4 failure handling.
      TYPE_ENV → immediate abort, TYPE_CODE → up to 2 web fallback retries.
      Web fallback uses the DeepSeek API.

      --- Reference: ERROR_CLASSIFIER_PROMPT + classify_error() from hybrid_pipeline.py ---
      ERROR_CLASSIFIER_PROMPT = '''Classify this Python error into exactly one word:
      TYPE_ENV — environment issue (missing library, permission, file not found)
      TYPE_CODE — code logic/syntax error, NameError, TypeError, AssertionError

      Error:
      {error}

      Classification:'''

      def classify_error(error_text: str) -> str:
          # Heuristic fallback (no model needed on host):
          env_markers = ["ModuleNotFoundError", "ImportError", "PermissionError",
                          "FileNotFoundError", "No such file"]
          for marker in env_markers:
              if marker in error_text:
                  return "TYPE_ENV"
          # Optionally call a fast local model (qwen3-4b) for classification.
          # If no model available, default to TYPE_CODE (retryable).
          return "TYPE_CODE"

      lib/error_classifier.py should expose: classify_error(error_text: str) -> str.
      Import in code_mod_pipeline.py: from lib.error_classifier import classify_error.
    expected_category: "feature_addition"
    evaluation:
      - error_classifier module separation
      - TYPE_ENV immediate abort
      - TYPE_CODE retry + web fallback
      - Graceful failure on retry exhaustion

  - id: 13
    stage: L13
    name: "Stage Failure Recovery — Web Retry Fallback"
    file: "/opt/projects/server/scripts/code_mod_pipeline.py"
    description: |
      Based on the error classifier added in T12, implement web retry fallback via the DeepSeek API
      for Stage 2-4 failures.
      For failures classified as TYPE_CODE:
      1. Send the failed stage's prompt + error message to the DeepSeek API
      2. Parse the response and convert the fixed result to the original stage output format
      3. Retry up to 2 times; on failure, fall back to the previous result
      Web retry timeout: 60 seconds, max_tokens=2048.

      --- Reference: web fix pattern from hybrid_pipeline.py ---
      DEEPSEEK_KEY = os.getenv("DEEPSEEK_API_KEY", "")
      WEB_FIX_URL = "https://api.deepseek.com/v1/chat/completions"
      WEB_FIX_MODEL = "deepseek-chat"

      def request_web_fix(step_id: int, code: str, error: str, context: str) -> Optional[str]:
          prompt = f'''Fix this Python code that failed during execution. Output ONLY the fixed code.

      ERROR:
      {error}

      FAILED CODE (step {step_id}):
      {code}

      ALL PREVIOUS STEPS (for context):
      {context}

      Fixed code for step {step_id}:'''
          status, body = call_llm(
              WEB_FIX_URL,
              [{"role": "user", "content": prompt}],
              api_key=DEEPSEEK_KEY, model=WEB_FIX_MODEL,
              timeout=60, max_tokens=2048,
          )
          if status == 200:
              result = extract_json_from_llm_response((status, body))
              fixed = result.get("raw_content", "").strip()
              fixed = re.sub(r'^```[a-z]*\n?', '', fixed)
              fixed = re.sub(r'\n?```$', '', fixed)
              return fixed
          return None

      lib.llm.client.call_llm() and lib.code_mod.shared.extract_json_from_llm_response()
      are already available in code_mod_pipeline.py. Integrate web fix into the retry loop
      in _call_stage_with_retry() or as a new _retry_stage_with_web_fix() helper.
    expected_category: "feature_addition"
    evaluation:
      - Web retry fallback behavior
      - Response format conversion accuracy
      - Retry limit compliance
      - Graceful degradation on failure

  - id: 14
    stage: L14
    name: "KeyRotator — Exponential Backoff + Jitter"
    file: "/opt/projects/server/scripts/lib/auth/key_rotator.py"
    description: |
      KeyRotator.rate_limited() currently uses a fixed backoff (60s).
      Parse rate limit response headers (Retry-After) to apply dynamic backoff,
      and if Retry-After is absent, add exponential backoff with jitter (±25%).
      base_delay=30s, backoff_multiplier=2.0, max_delay=600s.
      Keys whose backoff_until has expired should be automatically reactivated.
    expected_category: "feature_addition"
    evaluation:
      - Retry-After header parsing
      - Exponential backoff calculation accuracy
      - Jitter applied (±25%)
      - max_delay not exceeded
      - Expired key auto-reactivation

  - id: 15
    stage: L15
    name: "KeyRotator — Multi-Key Rotation Architecture"
    file: "/opt/projects/server/scripts/lib/auth/key_rotator.py"
    description: |
      Currently KeyRotator selects keys via _calls-based round-robin.
      Actual usage patterns show load bias toward specific keys.
      Improve this with fair-queue based rotation:
      1. Add a _weight (float) field instead of _calls (lower = higher priority)
      2. pick() selects the key with the lowest _weight
      3. success() → weight += 1.0, rate_limited() → weight += 10.0
      4. Keys whose backoff_until has passed reset to weight = min(weights)
      5. Maintain KeyRotator.pick()'s return type and compatibility with existing call sites
    expected_category: "structural_refactor"
    evaluation:
      - Weight-based selection correctness
      - Existing pick() interface compatibility
      - rate_limited key isolation
      - Reintegration after backoff expiry

  - id: 16
    stage: L16
    name: "Add 429 Detection + Auto-Backoff Tests"
    file: "/opt/projects/server/scripts/lib/auth/key_rotator.py"
    description: |
      KeyRotator has logic to automatically detect 429 responses and apply backoff,
      but there are no unit tests for this. Add pytest-based tests in the lib/ directory:
      1. Create test_key_rotator.py
      2. Test cases:
         - Basic pick()→success() cycle (normal behavior)
         - After rate_limited(), the key is excluded for a certain time
         - pick() returns None when all keys are in backoff state
         - Reactivation after backoff expiry
         - Weight-based selection (if T15 is implemented)
      3. Use monkeypatch to control time.time() to remove time dependency
    expected_category: "test_addition"
    evaluation:
      - All scenarios covered
      - monkeypatch usage
      - pytest --tb=short passes
      - No impact on existing call sites

