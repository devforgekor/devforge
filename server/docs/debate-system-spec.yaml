# =============================================================================
# 14. REVIEW QUESTIONS — ALL RESOLVED
# =============================================================================
review_questions:
  - id: "Q1"
    question: "DeepCoder-14B vs DeepSeek-Coder-6.7B for refuter role?"
    answer: "DeepCoder-14B-Preview Q4_K_M. 3/3 reviewers agree."
    rationale: "Refutation quality ≥ proposer quality is non-negotiable for debate efficacy."
    status: "RESOLVED (D1)"

  - id: "Q2"
    question: "Should Round 0 (DRAG) be optional?"
    answer: "Yes. Add --skip-drag CLI flag + auto-detection heuristics."
    implementation: "Skip if: (a) file paths present, (b) error messages present, (c) --skip-drag flag set."
    status: "RESOLVED (D2)"

  - id: "Q3"
    question: "Fixed 5 rounds or dynamic?"
    answer: "Fixed max=5 + early exit. No change from spec."
    status: "RESOLVED (D3)"

  - id: "Q4"
    question: "Phi-4-14B MLOCK in debate mode?"
    answer: "mlock=1. 3/3 reviewers agree."
    rationale: "Sequential execution = no RAM contention. 12GB RSS is safe within 22GB."
    status: "RESOLVED (D4)"

  - id: "Q5"
    question: "Persist shared_context across sessions as knowledge base?"
    answer: "Persist decision_summary + final_code to PostgreSQL instead."
    rationale: "Raw context grows unbounded. Summarized knowledge is more useful for future sessions."
    status: "RESOLVED (D5)"

  - id: "Q6"
    question: "32B context overflow risk with full 5-round history?"
    answer: "Phi-4-14B generates 500-word history summary before Round 5. 32B receives summary + last 2 rounds only."
    status: "RESOLVED (D6)"

  - id: "Q7"
    question: "DeepCoder max_tokens=64000 vs 8192?"
    answer: "Start with 8192. Increase only if <think> chain truncation observed."
    status: "RESOLVED (D7)"

  - id: "Q8"
    question: "JSON parsing strategy?"
    answer: "stdlib json.loads() with regex fallback. No external parser library."
    rationale: "Keep stdlib-only policy. Regex recovery handles 90% of malformed JSON cases."
    status: "RESOLVED (D8)"

