# ═══════════════════════════════════════════════════════════════
# DevForge Server — System Design
# ═══════════════════════════════════════════════════════════════
# 🔴 LLM: Read before making architectural decisions or changes
#     to infrastructure layout, network config, or access rules.
# ═══════════════════════════════════════════════════════════════

metadata:
  updated: "2026-06-03"
  status: "Phase 1 complete (2026-05-14)"
  server: "OCI ARM (24GB), Podman/Quadlet, PostgreSQL 16"

core_decisions:
  - id: 1
    decision: "Podman + Quadlet (user systemd)"
    rationale: "rootless, docker-compatible, declarative container management"
  - id: 2
    decision: "Pinned image tags (:2026.05.14)"
    rationale: "reproducible deployments, easy rollback"
  - id: 3
    decision: "PostgreSQL 16 (data-pod) + devforge_app"
    rationale: "pg_trgm search, JSONB meta, single DB"
  - id: 4
    decision: "MCP SSE (remote)"
    rationale: "Claude Code Mac ↔ server integration. stdio impossible (remote)"
  - id: 5
    decision: "Single secrets injection (EnvironmentFile)"
    rationale: "one secrets.env for all container secrets"
  - id: 6
    decision: "AI inference handled by Mac (original) → local llama.cpp (current)"
    rationale: "server does record/search/AI. LLM serves local Qwen (evolved from original design)"
  - id: 7
    decision: "Caddy (root, host network)"
    rationale: "Auto-HTTPS, single reverse proxy entry point"

infrastructure_layout:
  description: "Current infrastructure (evolved from original ai-pod/data-pod split)"
  containers:
    - name: "data-pod (2GB)"
      ip: "10.89.0.9"
      services:
        - "postgres :5432 (pod-internal)"
    - name: "Caddy (host network)"
      services:
        - "/devforge/* → turn_watcher.py (via DB)"
        - "netdata → localhost:19999"
    - name: "devforge-qwen (Pod A)"
      description: "Qwen3-4B inference. Day: 3B on :8082. Night: varies."
    - name: "devforge-swap (Pod B)"
      description: "Mode-switchable. Day: 30B on :8080. Night: 7B→14B→27B→32B per phase."

  legacy_diagram:
    comment: "Original ai-pod/data-pod layout (historical reference)"
    layout: |
      ai-pod (10.89.0.8, 16GB)     data-pod (10.89.0.9, 2GB)
      ├─ litellm :4000             └─ postgres :5432
      ├─ devforge-llm :8080
      └─ devforge-api :8000
         ├─ MCP SSE
         ├─ POST /ingest
         └─ GET /stats

network:
  bridge: "devforge-net (10.89.0.0/24)"
  internal_apis: "127.0.0.1 only"
  dns_enabled: true

access_restrictions:
  - path: "/opt/workspace/"
    rule: "OFF-LIMITS without explicit user instruction. Contains Seedling and other projects."

mcp_tools:
  - tool: "mem_save"
    input: "tag, summary, detail"
    behavior: "stores conversations + turns"
  - tool: "mem_search"
    input: "query, tag (optional)"
    behavior: "ILIKE search, JSON response"

db_schema:
  canonical_source: "schema.sql (inside app container)"
  target_db: "devforge_app (PostgreSQL 16)"
  tables:
    - conversations
    - turns
    - obs_dec
    - mcp_dec
    - observations
    - worklog_entries
  indexes:
    - "pg_trgm (search)"
    - "GIN (tags, meta)"
    - "UNIQUE (date, title)"
    - "UNIQUE partial (status='in_progress', dormant)"
  worklog_columns:
    status: "dormant, always 'done'"
    kind: "dormant, always 'task'"
    agent: "AI tool name"
    model: "model name"
    turn_ids: "linked turn UUID array"

backup:
  pg_dump: "dump_postgres.sh — daily devforge_app, 7-day retention"
  restore_test: "test_dump_restore.sh — monthly validation"
  nightly_batch: "nightly_batch.sh — daily pipeline KST 03:00, light jobs first (retry 3x) → heavy jobs"
  target: "/mnt/secure_meta/snapshots/"

external_references:
  - name: "totem"
    source: "mmnto-ai/totem (Apache-2.0)"
    relevance: "Primary reference. lesson→rule auto-conversion, doctor self-correction loop. Foundation for golden_diffs auto-collection and quality monitoring design."
  - name: "diff0 / Repeton"
    relevance: "Idea extraction only when needed during implementation (multi-provider validation, rollback loops)."

related_documents:
  - "Status/plan: docs/plans/phases.md"
  - "Task tracking: docs/plans/tasks.yaml (todo/in_progress/blocked/done)"
  - "Work history: devforge_app.worklog_entries (via cli.py worklog)"
  - "Operations config: CLAUDE.yaml, handover.yaml, blueprint.yaml"
