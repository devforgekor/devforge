[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devforge"
version = "1.4.0"
description = "DevForge: AI agent workflow pipeline server (refactored)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "DevForge Team" }
]
keywords = [
    "ai-agent", "llm-pipeline", "podman", "postgres", "mcp",
    "extraction", "embedding", "enrichment", "refactoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Runtime dependencies (core) ──
dependencies = [
    # Web framework (Track A)
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    # LLM / data
    "pydantic>=2.5,<3.0",
    # Database
    "asyncpg>=0.29,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    # Cloud
    "oci>=2.140,<3.0",
    "apprise>=1.0,<2.0",
    # CLI
    "typer>=0.9,<1.0",
    # Settings
    "pydantic-settings>=2.0,<3.0",
    # Logging / config files
    "structlog>=26.1.0,<27.0",
    "pyyaml>=6.0,<7.0",
    # MCP SSE
    "sse-starlette>=3.0,<4.0",
    # HTTP client (watchdog LLM probes, Slack webhooks)
    "httpx>=0.27,<1.0",
    # System metrics (watchdog memory/disk checks)
    "psutil>=7.2.2,<8.0",
    # Tracing API (2026-standard-gap §9) — no-op without an SDK/exporter
    "opentelemetry-api>=1.27,<2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=4.0,<8.0",
    "pytest-xdist>=3.0,<4.0",
    # Linting & type checking
    "ruff>=0.5,<1.0",
    "mypy>=2.3.1,<3.0",
    # Architecture
    "import-linter>=0.6,<3.0",
    # Legacy scripts deps required by tests/characterization (they import
    # scripts/lib/*, e.g. lib.text_cleaner needs tiktoken + langdetect).
    "tiktoken>=0.5,<1.0",
    "langdetect>=1.0,<2.0",
]
otel = [
    # Optional tracing backend (2026-standard-gap §9). Enable with
    # OTEL_EXPORTER_OTLP_ENDPOINT (OTLP/HTTP) or OTEL_TRACES_EXPORTER=console.
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]
track_b = [
    # Track B: LLM 공급자 추상화 (별도 문서화, Phase 0.5+에서 선택적 설치)
    "openai>=1.40,<2.0",
    "anthropic>=1.7.0,<2.0",
    "litellm>=1.40,<2.0",  # Optional: for unified provider routing
]

[project.scripts]
devforge = "devforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ─────────────────── ruff ───────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["tests/_archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "SIM"]
ignore = [
    "E501",   # line too long — tolerated per project style
    "SIM105", # contextlib.suppress pattern — try/except/pass is fine for cleanup
    "SIM115", # open() without context manager — valid for temp file patterns
    "UP",     # pyupgrade style rules deferred (would rewrite typing.List/Optional broadly)
]

[tool.ruff.lint.isort]
known-first-party = ["devforge"]

# ─────────────────── mypy ───────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "oci.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apprise.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "devforge.domain.models"
disable_error_code = ["var-annotated", "type-arg"]

[[tool.mypy.overrides]]
module = "devforge.adapters.driven.storage.extract_adapter"
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = "devforge.adapters.driven.storage.incident_pg"
disable_error_code = ["arg-type"]  # legacy Column-style ORM attribute typing

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

# ─────────────────── pytest ───────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/_archive"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-x",  # stop on first failure
    "--tb=short",
    "-q",
    "--strict-markers",
]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "characterization: characterization tests (behavior capture)",
    "shadow: shadow execution tests (production comparison)",
]

# ─────────────────── import-linter ───────────────────
# Architecture contracts — enforced in CI
# https://github.com/seddonym/import-linter
#
# Layer ordering (high to low): higher layers CAN import lower layers.
#   application      → depends on everything (highest level)
#   pipeline_stages  → depends on adapters, ports, core, domain
#   adapters          → depends on ports, core, domain
#   domain            → depends on core (for types)
#   core              → config + logging (standalone)
#   ports             → interfaces (lowest level, no deps)

[tool.importlinter]
fail_on_error = true
root_package = "devforge"

[[tool.importlinter.contracts]]
name = "layering"
type = "layers"
layers = [
    "devforge.application",
    "devforge.pipeline_stages",
    "devforge.adapters",
    "devforge.domain",
    "devforge.core",
    "devforge.ports",
]

[[tool.importlinter.contracts]]
name = "hexagonal"
type = "layers"
layers = [
    "devforge.adapters",
    "devforge.ports",
]

# Each domain subpackage is an independent bounded context: no direct imports
# between them. Cross-context coordination must be orchestrated by the
# application layer. (devforge.domain.models is shared data, not a context, so
# it is intentionally not listed here.)
[[tool.importlinter.contracts]]
name = "domain-subpackage-independence"
type = "independence"
modules = [
    "devforge.domain.turn_collection",
    "devforge.domain.pipeline",
    "devforge.domain.watchdog",
    "devforge.domain.model_management",
]

# Defense-in-depth for the hexagonal intent: the `layering` contract already
# forbids domain -> adapters transitively, but stating it explicitly keeps the
# rule intact even if the layer ordering is later edited, and makes the
# dependency direction obvious to readers of this file.
[[tool.importlinter.contracts]]
name = "domain-agnostic-of-adapters"
type = "forbidden"
source_modules = ["devforge.domain"]
forbidden_modules = ["devforge.adapters"]

