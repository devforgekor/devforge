# DevForge — Ingest & Provenance Contract
# Status: proposed (2026-09-14) · Owner: devforge
# Related: docs/adr/0006-mcp-tool-surface.md, docs/plans/final-plan.md
# Contract-freezing spec (pre-implementation). machine-readable — English only.
---
version: 1
change_log:
  - "2026-09-14: v1 proposed (ADR-0006). Defines HTTP+MCP ingest contract and provenance source taxonomy."

ingest:
  purpose: "Batch conversation ingestion — local agent transcripts + web-LLM capture."
  surfaces:
    http:
      method: POST
      path: /api/v1/ingest
      auth: "loopback-only (127.0.0.1) OR bearer token from secrets.env"
    mcp:
      tool: ingest
      transport: streamable-http
  request:
    type: object
    required: [source, conversation_id, turns]
    properties:
      source: {type: string, description: "provenance source id (see provenance.source)"}
      agent: {type: string, nullable: true}
      title: {type: string, nullable: true}
      model: {type: string, nullable: true}
      conversation_id:
        type: string
        format: uuid
        description: "Existing conversation UUID to append to. If empty or unknown UUID, a new conversation is created (id=uuid4 or the provided UUID)."
      turns:
        type: array
        items:
          type: object
          required: [seq, user_turn]
          properties:
            seq: {type: integer}
            user_turn: {type: string}
            thinking: {type: string, nullable: true}
            text: {type: string, nullable: true}
            meta: {type: object}
            source_message_id: {type: string, nullable: true}
  response:
    type: object
    properties:
      conversation_id: {type: string}
      inserted: {type: integer}
      skipped: {type: integer}
  idempotency: "unique(source_message_id) — fallback unique(conversation_id, seq)"
  errors:
    - {code: 400, when: "schema violation (missing source/conversation_id/turns)"}
    - {code: 400, when: "conversation_id is not a valid UUID"}
    - {code: 409, when: "duplicate turns (all skipped)"}
    - {code: 413, when: "payload too large"}

provenance:
  source:
    format: "<origin>[:<provider>]"
    values:
      - claude-code
      - opencode
      - mcp_ingest            # MCP ingest default (when origin unknown)
      - "chrome:chatgpt"
      - "chrome:claude"
      - "chrome:gemini"
      - "chrome:deepseek"
      - "chrome:aistudio"
      - "chrome:qwen"
      # retired 2026-09-19: copilot (cost exhausted), aider, gemini-cli — local collection stopped
    default: unknown
    storage_column: turns.source    # NOT NULL DEFAULT 'unknown'
  agent:
    description: "client/harness identifier (e.g. opencode, claude-code)"
    storage_column: turns.agent
    default: null
  confidence:
    type: number
    minimum: 0
    maximum: 1
    nullable: true
    note: "Extraction/post-correction confidence. null when not produced."

notes:
  - "turns.source is now 100% populated (unknown=0, verified 2026-09-20); new ingests record source/agent."
  - "Web capture (chrome-web) routes extension+relay into the ingest surface per ADR-0006."
  - "phase: implemented in final-plan Phase A (MCP/ingest) and B (web capture/provenance)."
