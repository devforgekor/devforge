# =============================================================================
# 5. RISK REGISTER (validated from spec v1.1 §17)
# =============================================================================
risk_validation:
  - risk: "Hot-swap timeout during model load"
    spec_assessment: "Likelihood: low, Impact: medium"
    review_validation: "Agreed. 240s timeout adequate for measured cold-start times."
    additional_note: >
      Qwen-32B (not yet benchmarked) is the highest risk. Expected 180s cold load.
      If measured >240s, increase timeout or add progress heartbeat from supervisor.

  - risk: "DeepCoder JSON malformation"
    spec_assessment: "Likelihood: medium, Impact: low"
    review_validation: "Agreed. Regex recovery + 1 re-prompt is sufficient."
    additional_note: >
      The <think> chain is the root cause. Consider asking DeepCoder to
      output <think>...</think> followed by the JSON block, and extract
      only the JSON block with regex. This may be more reliable than
      asking it to suppress <think> entirely.

  - risk: "Page cache thrashing"
    spec_assessment: "Likelihood: high, Impact: low"
    review_validation: >
      Agreed. The spec honestly documents that page cache benefit is limited
      when alternating 8GB+ models. Cold-start budget is correct.
    additional_note: >
      This is an architectural constant, not a bug. Accept 40-132s load times.
      Supervisor preserves the benefit of no container restart (no systemd overhead,
      no container init), even if page cache churn is inevitable.

  - risk: "22GB RAM ceiling with 32B"
    spec_assessment: "Likelihood: low, Impact: high"
    review_validation: >
      Agreed. History summary (A2) reduces context size. JSONL state enables
      resume on OOM kill. Risk is well-managed.

