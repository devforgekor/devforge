    1. Create datavg/lv_projects 10GB XFS → /opt/projects, fstab UUID

    2. Stop pods → rsync /opt/project → /opt/projects → SELinux container_file_t → symlink /opt/project → /opt/projects

    3. Unmount ocivolume/lv_dev → mount at /mnt/secure_meta → mkdir configs/secrets/snapshots/tmp → SELinux → fstab update

    4. Update container-litellm.service path → daemon-reload → start data-pod → start ai-pod → 180s model loading timeout

    5. .pgpass (devforge_app, devforge_meta) → dump_postgres.sh (both DBs, gzip integrity) → cron 03:13 daily → journald 30day
    retention

