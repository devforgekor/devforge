    - DB dump: 2 files (devforge_app + devforge_meta), restore test passed

    - seedling DB dropped (empty), replaced with devforge_app + devforge_meta

    - lv_dev renamed to lv_meta (ocivolume)

    - template1 collation version mismatch fixed

    '
