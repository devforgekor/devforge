- id: wd-q1-unit-type-health
  detail: 'watchdog v2 서비스 건강 판정은 유닛 타입을 고려한다(사용자 결정 2026-09-25). systemd는 oneshot이 ExecStart를 마치면 즉시 inactive가 정상(systemd#18949),
    장기러닝 서비스의 inactive는 장애. Prometheus 표준 규칙과 monitord(ignore_inactive_oneshot_services)도 동일 관례. 판정: LoadState≠loaded=장애 /
    failed=장애 / active·activating·reloading=정상 / inactive+oneshot=정상 / inactive+장기러닝=장애. systemctl show로 LoadState+Type+ActiveState를
    1회 조회.'
  status: resolved
- id: wd-q2-incident-record-policy
  detail: 'watchdog v2의 watchdog_incidents 기록 범위를 legacy와 동일하게 유지한다(사용자 결정 2026-09-25). 기록은 systemd 계열만 (svc:/timer:/oneshot:/syssvc:),
    memory·llm·disk·heartbeat는 복구와 알림만 수행하고 행을 만들지 않는다. 근거: Google SRE는 내부 상태(메모리 등) 기반 알림·티켓을 지양하고 증상 기반 알림을 권고, ITIL incident는
    계획되지 않은 서비스 중단이며 이는 SLO 오류 예산을 의미 있게 유지한다. watchdog_service.INCIDENT_COMPONENT_PREFIXES가 SSOT, parity 하네스가 같은 상수를 고정 테스트로
    묶는다.'
  status: resolved
