# LiteLLM Proxy config — DevForge
# Backend: llama-server (127.0.0.1:8080, OpenAI-compatible)

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/LITELLM_DATABASE_URL"

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600

model_list:
  # Review pipeline models (current.gguf symlink selects active model)
  - model_name: qwen2.5-coder-14b
    litellm_params:
      model: openai/qwen2.5-coder-14b
      api_base: http://127.0.0.1:8080/v1
      api_key: unused
      max_retries: 3
      tpm: 100000
      rpm: 1000

  - model_name: phi-4
    litellm_params:
      model: openai/phi-4
      api_base: http://127.0.0.1:8080/v1
      api_key: unused
      max_retries: 3
      tpm: 100000
      rpm: 1000

  - model_name: deepseek-r1-distill-qwen-14b
    litellm_params:
      model: openai/deepseek-r1-distill-qwen-14b
      api_base: http://127.0.0.1:8080/v1
      api_key: unused
      max_retries: 3
      tpm: 100000
      rpm: 1000

  - model_name: yi-coder-9b-chat
    litellm_params:
      model: openai/yi-coder-9b-chat
      api_base: http://127.0.0.1:8080/v1
      api_key: unused
