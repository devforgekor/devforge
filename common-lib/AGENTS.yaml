# AGENTS.yaml — detailed workflows for AI agents
# Rules are in CLAUDE.yaml. This file = procedures.

debug:
  - "Traceback path decides fix location — never ask user"
  - "common-lib in traceback -> fix in common-lib (editable install, instant)"
  - "project in traceback -> fix in project (review at harvest)"

compose:
  - "1. Read index.yaml -> find modules by keyword"
  - "2. Read full .py of candidates (types, logic, side effects)"
  - "3. Generate recipe JSON (module/call/with/save) + config JSON if needed"
  - "4. Execute: python scripts/run.py <recipe> [--config <project>.json]"
  - "5. Auto-recorded to builds/<name>-<timestamp>.json"
  - "6. Report: what was built, modules used, why"

harvest:
  - "1. Read completed project source"
  - "2. Find reusable: no hardcoded values, single job, not project-specific"
  - "3. Copy to common-lib: .py + docstring + type hints + SLOC <= 400"
  - "4. Run: python scripts/gen_index.py"
  - "5. Record: builds/harvest-<name>-<timestamp>.json"
  - "6. If new dep: add to requirements.txt"

recipe_format:
  file: "recipes/<name>.json"
  structure: >
    {name, summary, steps: [{module, call, with: {args}, save: var}]}
  arg_syntax: "$var_name -> step output or config value, $ENV_VAR -> env variable"
  config: "config/<project>.json for project-specific values, via --config"

docstring_format:
  template: "<path> | <English desc> | needs:<pkg> | uses:<mod> | config:<path> | api()"
  example: "oci/compute | OCI VM lifecycle: create terminate resize wait get-ip | needs:oci | launch(),terminate(),resize(),wait_until(),get_public_ip()"

build_record_format:
  type: "compose | harvest | build | change"
  fields: "timestamp, type, project, summary, modules_used, config, result"
