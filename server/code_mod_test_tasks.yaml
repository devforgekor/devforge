api_targets:
  - name: "deepseek-v4-pro"
    endpoint: "https://api.deepseek.com/v1/chat/completions"
    model: "deepseek-chat"
    role: "Claude Code primary"
  - name: "deepseek-v4-flash"
    endpoint: "https://api.deepseek.com/v1/chat/completions"
    model: "deepseek-chat"  # same model, different usage pattern
    role: "Aider primary"
