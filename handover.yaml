- id: watchdog-probe-ownership-2026-09-20
  detail: '원인: day_cycle은 순차 파이프라인(flock 단일인스턴스+oneshot)인데, watchdog가 독립적으로 :8082를 60s마다 probe하고 503(Loading)/timeout을 장애로
    판정→recover_inference_cascade(inference 재시작)→파이프라인 모델을 죽여 churn(특히 embed 모드는 :8082 부재로 100% 실패). 수정(1+2): (1) 관용성 — LLM_PROBE_TIMEOUT_SEC
    60→120, LLM_PROBE_FAIL_THRESHOLD=3(연속 3회), 503/Loading은 transient로 카운트 제외. (2) 소유권 — day_cycle 파이프라인 실행 중이면 probe recovery/파이프라인-stuck
    restart 모두 skip. 추가: watchdog day-cycle 자동기동에 pause 플래그 가드, embed_window.sh(day-cycle+watchdog 정지→embed 완주→복구). 검증: 실행
    중 probe 로그가 skip recovery로 전환. commit 1d2cee1.'
  status: resolved
