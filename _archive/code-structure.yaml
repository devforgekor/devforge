# ═══════════════════════════════════════════════════════════════════════════
# DevForge Code Structure — Single Source of Truth for File Layout
# ═══════════════════════════════════════════════════════════════════════════
# 🔴 CRITICAL: LLM MUST read this before creating, moving, or modifying any file.
# 🔴 If unsure where a change belongs, check here first. Ask user if still unclear.
# 🔴 Do NOT create new files under `scripts/` without user approval.
#
# Rule priority: code-structure.yaml > llm-common-rule.md > agent's judgment
# If this file says a module has `no_subprocess: true`, do NOT add subprocess calls there.
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  updated: "2026-06-06"
  rule: "LLM MUST read this file before any file creation or structural modification"

# ── Root Modules ──────────────────────────────────────────────────────────

modules:
  - path: scripts/
    purpose: "🚀 Executable entry points, pipelines, services, and tests"
    constraints:
      entry_points_only: true
      delegate_logic_to_lib: true
      allowed_pattern: "^[a-z][a-z0-9_]*\\.(py|sh)$"
      import_restrictions: ["May import from scripts.lib only", "May NOT import from other scripts/ root modules"]
    allow_new_files: false
    files:
      cli.py:
        status: production
        purpose: "🎯 Main CLI — all user-facing commands (activity, worklog, mode, discussion, drag, toolmad)"
        max_lines: 800
        no_subprocess: false
      orchestrator.py:
        status: production
        purpose: "🧩 Task orchestrator — routes pipeline/debate/review by task type"
        max_lines: 500
      anthropic_proxy.py:
        status: production
        purpose: "🔄 Anthropic API proxy → DeepSeek — cch stripping, cache tracking, tool_use_id fix"
        max_lines: 1400
        is_long_term: true  # complex proxy requires higher limit

  - path: scripts/lib/
    purpose: "📚 Shared libraries — NO entry points, NO side effects at import time"
    constraints:
      max_lines: 400
      no_direct_subprocess: false
      no_direct_db: false
      allowed_pattern: "^[a-z][a-z0-9_]*\\.py$"
      import_restrictions:
        - "May import from lib/ subpackages only (auth, code_mod, infra, llm, output, parsers, search, state, tracking)"
        - "May NOT import from scripts/ root modules"
        - "Prefer stdlib. Only allowed external deps: pyyaml, tenacity"
    files:
      db.py:
        status: production
        purpose: "🐘 PostgreSQL query helpers — psql(), psql_ok(), esc_sql(), db_table_exists()"
        max_lines: 150
        constraint: "MUST use podman exec psql. NEVER psql -h localhost."
      agents.py:
        status: production
        purpose: "🏷️ Agent name normalization — single source of truth"
        max_lines: 30
      feedback.py:
        status: production
        purpose: "🔄 Few-shot feedback loop — extracts fix patterns from activity_log for LLM injection"
        max_lines: 550
        is_long_term: true
      blob_uploader.py:
        status: production
        purpose: "☁️ Azure Blob upload — review bundles, pipeline outputs"
        max_lines: 150
      bot_processor.py:
        status: production
        purpose: "🤖 Shared bot processor — Telegram & Slack intent classification"
        max_lines: 200
      crypto.py:
        status: production
        purpose: "🔐 Encryption utilities"
        max_lines: 100
      llm_client.py:
        status: production
        purpose: "🏗️ Unified LLM entry point — wraps both local (llama.cpp) and remote (DeepSeek) calls"
        max_lines: 150
        import_restrictions:
          - "May call lib/llm/client.py (remote) and lib/llm/llm_client.py (local)"
      mcp_consumer.py:
        status: production
        purpose: "🔌 MCP metadata consumer — reads review_facts for MCP tool integration"
        max_lines: 150
      parser_aider.py:
        status: production
        purpose: "⏮️ Backward-compat shim → lib.parsers.aider (3 lines)"
        max_lines: 5
      queue_writer.py:
        status: production
        purpose: "📤 Enqueue items to activity_log for downstream review pipeline"
        max_lines: 80
      scoring.py:
        status: production
        purpose: "📊 Veto/gap/early-exit logic — single source of truth for consensus scoring"
        max_lines: 120
      phase_tracker.py:
        status: production
        purpose: "📐 Phase completion detection from live system state"
        max_lines: 100
      test_sandbox.py:
        status: experimental
        purpose: "🧪 Podman read-only tmpfs sandbox for safe code execution"
        max_lines: 150
      text_quality.py:
        status: production
        purpose: "🔤 Korean text quality guardrails — think-tag detection, token budget check"
        max_lines: 100
      worklog.py:
        status: production
        purpose: "📓 Git commit → worklog sync"
        max_lines: 80

