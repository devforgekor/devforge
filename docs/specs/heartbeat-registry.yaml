# heartbeat registry — dead-man's switch (F2, fitness-functions-heartbeat-drift-guide.md §3).
# [WHY] watchdog v2 HeartbeatHealthChecker reads these workers from watchdog_pulses as
# heartbeat_<job> and alerts when age >= max_age_sec. Emitters are the ExecStartPost hooks on
# the listed systemd units (scripts/deploy/heartbeat-ping.sh <job>).
# Keep in sync with src/devforge/core/config.py heartbeat_workers and
# scripts/lib/watchdog/config.py HEARTBEAT_WORKERS (parity test test_watchdog_config_parity).
version: 1
jobs:
  handover_gen:    {kind: systemd, interval_sec: 600,   grace_sec: 300,  max_age_sec: 900,   unit: devforge-handover-gen.service}
  daily_structure: {kind: systemd, interval_sec: 86400, grace_sec: 3600, max_age_sec: 90000, unit: devforge-daily-structure.service}
  backup:          {kind: systemd, interval_sec: 86400, grace_sec: 7200, max_age_sec: 93600, unit: devforge-backup.service}
  system_sync:     {kind: systemd, interval_sec: 1800,  grace_sec: 600,  max_age_sec: 2400,  unit: devforge-system-sync.service}
  # [WHY] openclaw cron (not a systemd unit) — emitter is a separate command
  # payload job (git:diff-heartbeat), not an ExecStartPost hook. An agent turn
  # cannot obtain exec approval headlessly and silently voids the pulse while
  # still reporting lastRunStatus ok.
  # kind=payload 이므로 unit 파일을 요구하지 않는다 — 펄스는 실제로 정상 수신된다
  # (2026-10-03 확인: heartbeat_git_diff_report age 2.8h < max_age 7h).
  git_diff_report: {kind: payload, interval_sec: 21600, grace_sec: 3600, max_age_sec: 25200, unit: null, emitter: openclaw-cron:git:diff-report}
