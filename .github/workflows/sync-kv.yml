name: Sync to Azure Key Vault

on:
  workflow_dispatch:

jobs:
  sync-kv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MESIDS_CLIENT_SECRET_ID }}
          tenant-id: ${{ secrets.AZURE_MESIDS_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_MESIDS_CLIENT_SECRET_VALUE }}

      - name: Generate secrets list
        id: gen
        env:
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          CONTEXT7_API_KEYS: ${{ secrets.CONTEXT7_API_KEYS }}
          EXA_API_KEYS: ${{ secrets.EXA_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TRAVILY_API_KEYS: ${{ secrets.TRAVILY_API_KEYS }}
          YOUCOM_API_KEYS: ${{ secrets.YOUCOM_API_KEYS }}
          OPENROUTER_MESIDS_API_KEY: ${{ secrets.OPENROUTER_MESIDS_API_KEY }}
          OPENROUTER_MINIPARK4U_API_KEY: ${{ secrets.OPENROUTER_MINIPARK4U_API_KEY }}
          OPENROUTER_HYEONMINPARK4U_API_KEY: ${{ secrets.OPENROUTER_HYEONMINPARK4U_API_KEY }}
          DEVFORGE_DATABASE_URL: ${{ secrets.DEVFORGE_DATABASE_URL }}
          LITELLM_DATABASE_URL: ${{ secrets.LITELLM_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DEVFORGE_ENCRYPTION_PASSPHRASE: ${{ secrets.DEVFORGE_ENCRYPTION_PASSPHRASE }}
          DEVFORGE_LITELLM_MASTER_KEY: ${{ secrets.DEVFORGE_LITELLM_MASTER_KEY }}
          DEVFORGE_POSTGRES_PASSWORD: ${{ secrets.DEVFORGE_POSTGRES_PASSWORD }}
          TELEGRAM_TOKEN_KEY: ${{ secrets.TELEGRAM_TOKEN_KEY }}
          TELEGRAM_TEST_TOKEN_KEY: ${{ secrets.TELEGRAM_TEST_TOKEN_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_BOT_TOKEN_KEY: ${{ secrets.SLACK_BOT_TOKEN_KEY }}
          SLACK_SIGNING_SECRET_KEY: ${{ secrets.SLACK_SIGNING_SECRET_KEY }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GUDOKPIN_API_KEY: ${{ secrets.GUDOKPIN_API_KEY }}
          NOTION_TOKEN_KEY: ${{ secrets.NOTION_TOKEN_KEY }}
          MASKPROXY_API_KEY: ${{ secrets.MASKPROXY_API_KEY }}
          DUCKDNS_TOKEN_KEY: ${{ secrets.DUCKDNS_TOKEN_KEY }}
          DATAIMPULSE_PROXY_KEY: ${{ secrets.DATAIMPULSE_PROXY_KEY }}
          MASKPROXY_PROXY_KEY: ${{ secrets.MASKPROXY_PROXY_KEY }}
          GMAIL_SMTP_MINIPARK4U: ${{ secrets.GMAIL_SMTP_MINIPARK4U }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          MY_GITHUB_TOKEN_KEY: ${{ secrets.MY_GITHUB_TOKEN_KEY }}
          MY_COPILOT_GITHUB_TOKEN_KEY: ${{ secrets.MY_COPILOT_GITHUB_TOKEN_KEY }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          DROPLR_USER: ${{ secrets.DROPLR_USER }}
          DROPLR_PASS: ${{ secrets.DROPLR_PASS }}
          ZIGHT_API_KEY: ${{ secrets.ZIGHT_API_KEY }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN_KEY: ${{ secrets.VERCEL_TOKEN_KEY }}
          VERCEL_REVALIDATE_TOKEN_KEY: ${{ secrets.VERCEL_REVALIDATE_TOKEN_KEY }}
        run: |
          echo "KEYVAULT_NAME=${{ secrets.AZURE_MESIDS_KEYVAULT_URL }}" | sed 's|https://\([^.]*\).*|\1|' | awk '{print $2}' > /tmp/kvname.txt
          echo "vault=$(cat /tmp/kvname.txt)" >> $GITHUB_OUTPUT

      - name: Push secrets to Key Vault
        env:
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          CONTEXT7_API_KEYS: ${{ secrets.CONTEXT7_API_KEYS }}
          EXA_API_KEYS: ${{ secrets.EXA_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TRAVILY_API_KEYS: ${{ secrets.TRAVILY_API_KEYS }}
          YOUCOM_API_KEYS: ${{ secrets.YOUCOM_API_KEYS }}
          OPENROUTER_MESIDS_API_KEY: ${{ secrets.OPENROUTER_MESIDS_API_KEY }}
          OPENROUTER_MINIPARK4U_API_KEY: ${{ secrets.OPENROUTER_MINIPARK4U_API_KEY }}
          OPENROUTER_HYEONMINPARK4U_API_KEY: ${{ secrets.OPENROUTER_HYEONMINPARK4U_API_KEY }}
          DEVFORGE_DATABASE_URL: ${{ secrets.DEVFORGE_DATABASE_URL }}
          LITELLM_DATABASE_URL: ${{ secrets.LITELLM_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DEVFORGE_ENCRYPTION_PASSPHRASE: ${{ secrets.DEVFORGE_ENCRYPTION_PASSPHRASE }}
          DEVFORGE_LITELLM_MASTER_KEY: ${{ secrets.DEVFORGE_LITELLM_MASTER_KEY }}
          DEVFORGE_POSTGRES_PASSWORD: ${{ secrets.DEVFORGE_POSTGRES_PASSWORD }}
          TELEGRAM_TOKEN_KEY: ${{ secrets.TELEGRAM_TOKEN_KEY }}
          TELEGRAM_TEST_TOKEN_KEY: ${{ secrets.TELEGRAM_TEST_TOKEN_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_BOT_TOKEN_KEY: ${{ secrets.SLACK_BOT_TOKEN_KEY }}
          SLACK_SIGNING_SECRET_KEY: ${{ secrets.SLACK_SIGNING_SECRET_KEY }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GUDOKPIN_API_KEY: ${{ secrets.GUDOKPIN_API_KEY }}
          NOTION_TOKEN_KEY: ${{ secrets.NOTION_TOKEN_KEY }}
          MASKPROXY_API_KEY: ${{ secrets.MASKPROXY_API_KEY }}
          DUCKDNS_TOKEN_KEY: ${{ secrets.DUCKDNS_TOKEN_KEY }}
          DATAIMPULSE_PROXY_KEY: ${{ secrets.DATAIMPULSE_PROXY_KEY }}
          MASKPROXY_PROXY_KEY: ${{ secrets.MASKPROXY_PROXY_KEY }}
          GMAIL_SMTP_MINIPARK4U: ${{ secrets.GMAIL_SMTP_MINIPARK4U }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          MY_GITHUB_TOKEN_KEY: ${{ secrets.MY_GITHUB_TOKEN_KEY }}
          MY_COPILOT_GITHUB_TOKEN_KEY: ${{ secrets.MY_COPILOT_GITHUB_TOKEN_KEY }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          DROPLR_USER: ${{ secrets.DROPLR_USER }}
          DROPLR_PASS: ${{ secrets.DROPLR_PASS }}
          ZIGHT_API_KEY: ${{ secrets.ZIGHT_API_KEY }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN_KEY: ${{ secrets.VERCEL_TOKEN_KEY }}
          VERCEL_REVALIDATE_TOKEN_KEY: ${{ secrets.VERCEL_REVALIDATE_TOKEN_KEY }}
          VAULT: ${{ steps.gen.outputs.vault }}
        run: |
          set -e
          echo "Vault: $VAULT"
          for key in BRAVE_API_KEYS CONTEXT7_API_KEYS EXA_API_KEYS GEMINI_API_KEYS TRAVILY_API_KEYS YOUCOM_API_KEYS OPENROUTER_MESIDS_API_KEY OPENROUTER_MINIPARK4U_API_KEY OPENROUTER_HYEONMINPARK4U_API_KEY DEVFORGE_DATABASE_URL LITELLM_DATABASE_URL NEON_DATABASE_URL DEVFORGE_ENCRYPTION_PASSPHRASE DEVFORGE_LITELLM_MASTER_KEY DEVFORGE_POSTGRES_PASSWORD TELEGRAM_TOKEN_KEY TELEGRAM_TEST_TOKEN_KEY TELEGRAM_CHAT_ID SLACK_BOT_TOKEN_KEY SLACK_SIGNING_SECRET_KEY SLACK_CHANNEL DEEPSEEK_API_KEY GUDOKPIN_API_KEY NOTION_TOKEN_KEY MASKPROXY_API_KEY DUCKDNS_TOKEN_KEY DATAIMPULSE_PROXY_KEY MASKPROXY_PROXY_KEY GMAIL_SMTP_MINIPARK4U HUGGINGFACE_API_KEY MY_GITHUB_TOKEN_KEY MY_COPILOT_GITHUB_TOKEN_KEY NEIS_API_KEY DROPLR_USER DROPLR_PASS ZIGHT_API_KEY CAPSOLVER_API_KEY VERCEL_ORG_ID VERCEL_TOKEN_KEY VERCEL_REVALIDATE_TOKEN_KEY; do
            value="${!key}"
            if [ -n "$value" ]; then
              echo "Setting $key..."
              az keyvault secret set --vault-name "$VAULT" --name "$key" --value "$value" -o none
            else
              echo "Skipping $key (empty)"
            fi
          done
          echo "✅ Key Vault sync complete"