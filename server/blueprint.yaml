# DevForge Blueprint — Target Architecture & Roadmap v1.1
# AI-maintained: updated as phases progress, items complete, or architecture decisions change.
# Human reads for context; AI writes to keep current.
# Phase status: planned → active → complete
# Last updated: 2026-05-14 (AI session — worklog system refactor)

phases:
  - phase: 1
    name: "Basic Infrastructure + MCP Server"
    status: "complete"
    completed: "2026-05-14"
    items:
      - "Podman Quadlet 6 containers (ai-pod + data-pod)"
      - "PostgreSQL 16 + pg_trgm + JSONB meta"
      - "MCP SSE server (mem_save, mem_search)"
      - "POST /ingest (batch conversation storage)"
      - "Python CLI (search/save/recent/worklog add/recent/search)"
      - "GET /stats (7-section dashboard)"
      - "daily pg_dump + monthly restore test"
      - "RSS upstream version monitoring"
      - "worklog_entries DB table + tasks.yaml task tracker"
      - "session_guard.py auto-commit safety net + session_start.py context injection"

  - phase: 2
    name: "Enhancement"
    status: "planned"
    items:
      - "pgvector embedding search (semantic search)"
      - "MemPalace classification (wing/room, auto conversation classification)"
      - "CLI Search-Augmented integration"
      - "Web UI (conversation search dashboard)"

  - phase: 3
    name: "Someday/Maybe"
    status: "planned"
    items:
      - "Chrome Extension → direct server upload"
      - "iOS Shortcuts integration"
      - "Multi-LLM routing (additional models via litellm)"

target:
  services:
    - name: "devforge-llm"
      type: "systemd user"
      image: "localhost/devforge-llama:2026.05.14"
      model: "qwen2.5-coder-7b-instruct-q8_0.gguf"
      flags:
        threads: 4
        ctx_size: 16384
        mlock: false
        memory: "16g"
        cache_reuse: 256
        host: "0.0.0.0"
        port: 8080
      networking: "Quadlet pod network (devforge-net)"

    - name: "litellm"
      type: "systemd user / Quadlet container"
      image: "localhost/devforge-litellm:2026.05.14"
      purpose: "API gateway — unified OpenAI-compatible endpoint with model routing"
      endpoint: "127.0.0.1:4000"

    - name: "devforge-api"
      type: "systemd user / Quadlet container"
      image: "localhost/devforge-api:2026.05.14"
      purpose: "MCP SSE server + POST /ingest + GET /stats"
      endpoint: "127.0.0.1:8000"

    - name: "postgresql"
      type: "systemd user / Quadlet container"
      data_dir: "/dev/datavg/lv_db"
      mount: "/mnt/lv_db"
      purpose: "devforge_app database (conversations, turns, worklog_entries)"

    - name: "netdata"
      type: "systemd system"
      endpoint: "127.0.0.1:19999"
      purpose: "Real-time system monitoring dashboard with auto-discovery"

  network:
    internal_api: "ai-pod:8080 via devforge-net (published on host 127.0.0.1:8080)"
    gateway_api: "ai-pod:4000 via devforge-net (published on host 127.0.0.1:4000)"
    application: "ai-pod:8000 via devforge-net (published on host 127.0.0.1:8000)"
    monitoring: "127.0.0.1:19999 (Netdata)"

  storage:
    lv_db:
      device: "/dev/datavg/lv_db"
      size: "30G"
      status: "mounted"
      target: "/mnt/lv_db (PostgreSQL 16 data directory)"

backlog:
